    <style>
      body { margin: 0; min-height: 100vh; }
      main { max-width: 1040px; margin: 0 auto; padding: 20px 20px 110px; }
      .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
      .up { color: var(--tt-success, #34d399); }
      .dn { color: var(--tt-danger, #ef4444); }
      .dim { color: var(--tt-text-dim, #6E867D); }

      /* Top nav — same structure as journey pages (shared-nav.js).
         Without these rules the brand + links stack and look like a
         second broken nav row above the real header. */
      nav.topnav {
        position: sticky; top: 0; z-index: 50;
        background: rgba(11, 20, 16, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--tt-border, rgba(255,255,255,0.08));
      }
      .nav-row {
        max-width: 1600px; margin: 0 auto;
        padding: 12px 24px;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
      }
      .nav-brand {
        display: inline-flex; align-items: center; gap: 10px;
        text-decoration: none; color: var(--tt-text, #e8f0ec); font-weight: 700;
      }
      .nav-links { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .nav-link {
        font-size: 12.5px; color: var(--tt-text-muted, #8aa399);
        text-decoration: none; padding: 6px 12px; border-radius: 8px;
        transition: background 120ms ease, color 120ms ease;
      }
      .nav-link:hover { color: var(--tt-text, #e8f0ec); background: rgba(255,255,255,0.05); }
      .nav-link.active {
        color: var(--tt-accent, #38F2A1);
        background: rgba(56, 242, 161, 0.12);
      }
      .nav-link.learn { color: var(--tt-up-soft, #6ee7b7); }
      .nav-link.faq { color: var(--tt-text-2, #a3b5ad); }

      /* ── chips + pills ─────────────────────────────────────────── */
      .bc-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; white-space: nowrap; }
      .bc-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .p-ok   { background: rgba(52,211,153,0.10); color: var(--tt-success); border: 1px solid rgba(52,211,153,0.28); }
      .p-warn { background: rgba(245,158,11,0.10); color: var(--tt-warning); border: 1px solid rgba(245,158,11,0.28); }
      .p-err  { background: rgba(239,68,68,0.10); color: var(--tt-danger); border: 1px solid rgba(239,68,68,0.28); }
      .p-info { background: rgba(103,232,249,0.09); color: var(--tt-info); border: 1px solid rgba(103,232,249,0.25); }
      .p-off  { background: rgba(255,255,255,0.04); color: var(--tt-text-dim); border: 1px solid rgba(255,255,255,0.09); }
      .p-mint { background: rgba(56,242,161,0.10); color: var(--vf-primary, #38F2A1); border: 1px solid rgba(56,242,161,0.3); }

      /* ── buttons / inputs ──────────────────────────────────────── */
      .bc-btn { padding: 8px 15px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--tt-border-strong, rgba(255,255,255,0.12)); background: rgba(255,255,255,0.04); color: var(--tt-text-1); transition: transform 0.12s, background 0.15s; }
      .bc-btn:hover:not(:disabled) { transform: translateY(-1px); background: rgba(255,255,255,0.07); }

      .bc-btn-danger { background: rgba(239,68,68,0.09); color: var(--tt-danger); border-color: rgba(239,68,68,0.3); }

      .bc-input:focus { outline: none; border-color: rgba(56,242,161,0.5); }
      .caps-input { width: 92px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--tt-border-strong, rgba(255,255,255,0.12)); background: rgba(255,255,255,0.03); color: var(--tt-text-0); font-size: 12px; font-family: "JetBrains Mono", ui-monospace, monospace; }
      .lbl { display: block; font-size: 10px; font-weight: 700; color: var(--tt-text-dim); letter-spacing: 0.07em; text-transform: uppercase; margin: 12px 0 5px; }

      @media (max-width: 720px) { .kpi-strip { grid-template-columns: repeat(2, 1fr); } }
      .kpi { background: var(--tt-bg-1); border: 1px solid var(--tt-border-weak); border-radius: 14px; padding: 13px 15px; min-width: 0; }

        display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));

      .acct-perf-card {
        appearance: none; width: 100%; min-width: 0; text-align: left;
        padding: 12px 13px; color: var(--tt-text-1);
        background: var(--tt-bg-1); border: 1px solid var(--tt-border-weak);
        border-radius: 14px; cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;

      .acct-perf-card:hover {

      }
      .acct-perf-card.on { border-top: 2px solid var(--tt-success); }
      .acct-perf-card.off { border-top: 2px solid rgba(255,255,255,0.14); }
      .acct-perf-card.active { box-shadow: 0 0 0 1px rgba(56,242,161,0.38); }
      .acct-perf-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .acct-perf-name { font-size: 12px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        margin-top: 9px; font: 700 17px/1.15 "JetBrains Mono", ui-monospace, monospace;

        margin-top: 5px; font: 700 12px/1.3 "JetBrains Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .acct-perf-sub { margin-top: 2px; font-size: 10px; color: var(--tt-text-dim); }
      .acct-perf-since {
        margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--tt-border-weak);

        color: var(--tt-text-2); font-size: 10px;
      }
      .acct-perf-since b {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .acct-compare { display: flex; gap: 8px; flex-wrap: wrap; }
      .eq-chart { width: 100%; height: 220px; display: block; }
      .eq-chart .eq-line { stroke-linejoin: round; stroke-linecap: round; animation: eqDraw 0.85s ease-out both; }
      .eq-chart .eq-area { animation: eqFade 0.7s ease-out both; }
      .eq-live { animation: eqPulse 1.6s ease-in-out infinite; }
      @keyframes eqDraw { from { stroke-dashoffset: 1200; opacity: 0.35; } to { stroke-dashoffset: 0; opacity: 1; } }
      @keyframes eqFade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes eqPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

      .eq-mark-off { stroke: rgba(255,255,255,0.28); }
      .tl-day-h { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tt-text-dim); padding: 8px 0 4px; }
      .tl-day-coll { border-top: 1px solid var(--tt-border-weak); }

      .tl-day-coll[open] > summary::after { content: "▾"; }

      /* ── timeline ──────────────────────────────────────────────── */
      .tl { position: relative; margin: 4px 0 0; }
      .tl-row { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 10px 4px 10px 0; border-top: 1px solid var(--tt-border-weak); }

      .tl-line { flex: 1; width: 2px; background: var(--tt-border-weak); margin-top: 4px; border-radius: 2px; }
      .tl-main { flex: 1; min-width: 0; }
      .tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .tl-time { font-size: 11px; color: var(--tt-text-dim); }
      .tl-detail { margin-top: 8px; padding: 10px 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--tt-border-weak); border-radius: 10px; font-size: 12px; }
      .tl-acct-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; flex-wrap: wrap; }

      /* ── positions ─────────────────────────────────────────────── */
      .pos-card {
        position: relative; padding: 14px 16px; margin: 10px 0 0;
        background: rgba(255,255,255,0.02); border: 1px solid var(--tt-border-weak);
        border-radius: 14px; transition: background 0.12s, border-color 0.12s;
      }
      .pos-card:hover { background: rgba(255,255,255,0.035); border-color: rgba(255,255,255,0.14); }
      .pos-card.pos-card--up { border-left: 3px solid var(--tt-success, #34d399); }
      .pos-card.pos-card--dn { border-left: 3px solid var(--tt-danger, #ef4444); }
      .pos-card.pos-card--flat { border-left: 3px solid rgba(255,255,255,0.12); }
      .pos-row { display: grid; grid-template-columns: 34px minmax(90px, 1.2fr) 1fr 1fr 1.1fr auto; gap: 10px; align-items: center; padding: 0; }
      .pos-guide {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        margin-top: 8px; font-size: 12px; color: var(--tt-text-2);
      }
      .pos-guide .g-icon {
        display: inline-flex; align-items: center; justify-content: center;
        width: 18px; height: 18px; border-radius: 999px;
        background: rgba(56,242,161,0.14); color: var(--vf-primary, #38F2A1);
        font-size: 10px; font-weight: 800;
      }
      .pos-head { display: grid; grid-template-columns: 34px minmax(90px, 1.2fr) 1fr 1fr 1.1fr auto; gap: 10px; padding: 2px 4px 7px; font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--tt-text-dim); }
      @media (max-width: 720px) {
        .pos-row { grid-template-columns: 30px 1fr auto; grid-template-areas: "av tick sync" "av px pnl"; row-gap: 4px; }
        .pos-head { display: none; }
        .pos-a-av { grid-area: av; } .pos-a-tick { grid-area: tick; } .pos-a-px { grid-area: px; }
        .pos-a-val { display: none; } .pos-a-pnl { grid-area: pnl; text-align: right; } .pos-a-sync { grid-area: sync; text-align: right; }
      }
      .tk-avatar { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 800; letter-spacing: 0.02em; color: #0b1410; }
      .pos-ticker-btn {
        appearance: none; background: none; border: none; padding: 0; margin: 0;
        font: inherit; font-weight: 800; font-size: 14px; color: inherit; cursor: pointer;
        text-decoration: none; border-bottom: 1px solid transparent;
      }
      .pos-ticker-btn:hover { color: var(--vf-primary, #38F2A1); border-bottom-color: rgba(56,242,161,0.45); }
      .pnl-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.06); margin-top: 4px; overflow: hidden; position: relative; }
      .pnl-bar span { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
      .pos-detail { padding: 10px 12px 12px 48px; border-top: 1px dashed var(--tt-border-weak); background: rgba(255,255,255,0.012); }
      @media (max-width: 720px) { .pos-detail { padding-left: 12px; } }
      .hist-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 12px; flex-wrap: wrap; }
      .acct-summary { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--tt-text-2); margin: 2px 0 8px; }
      .acct-summary b { font-variant-numeric: tabular-nums; }

      /* ── skeleton shimmer ──────────────────────────────────────── */
      .skel { position: relative; overflow: hidden; background: rgba(255,255,255,0.035); border-radius: 8px; }
      .skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimmer 1.4s infinite; }
      @keyframes shimmer { 100% { transform: translateX(100%); } }

      .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
      .fade-in { animation: fadeIn 0.25s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
      code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      ol.steps { margin: 8px 0 0; padding-left: 18px; color: var(--tt-text-2); font-size: 13px; line-height: 1.7; }

  <body class="vf-page">
    <!-- Global nav (Today · Model · Portfolio · Insights …) — same shared
         header used across the journey pages. Must come before the app root
         so the deferred consumers (tt-nav-extras, tt-bottom-nav, investor
         badge) find their mount target. -->
    <div id="global-nav-root"></div>
    <script src="shared-nav.js?v=20260611a"></script>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useCallback, useMemo } = React;
      const API_BASE = "";
      const PU = window.TimedPriceUtils || {};

      /* ── formatting helpers ─────────────────────────────────────── */
      const fmtUsd = (v, opts = {}) => {
        if (v == null || !Number.isFinite(Number(v))) return "—";
        const n = Number(v);
        const abs = Math.abs(n);
        const dec = opts.compact && abs >= 1000 ? 0 : 2;
        return (n < 0 ? "-$" : "$") + abs.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
      };
      const fmtSigned = (v) => {
        if (v == null || !Number.isFinite(Number(v))) return "—";
        const n = Number(v);
        return (n >= 0 ? "+" : "-") + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };
      const fmtQty = (v) => {
        const n = Number(v);
        if (!Number.isFinite(n)) return "—";
        return Math.abs(n % 1) < 1e-9 ? String(n) : n.toFixed(Math.abs(n) < 1 ? 5 : 3).replace(/0+$/, "").replace(/\.$/, "");
      };
      const fmtTime = (ts) => new Date(ts).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }) + " ET";
      const fmtDay = (ts) => new Date(ts).toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric" });
      const nyDateKey = (ts) => new Date(ts).toLocaleDateString("en-CA", { timeZone: "America/New_York" });
      const minsAgo = (ts) => Math.max(0, Math.round((Date.now() - Number(ts)) / 60000));
      function firstMirrorOnTs(acct) {
        const ev = Array.isArray(acct?.mirror_events) ? acct.mirror_events : [];
        const ons = ev.filter((e) => e && e.on === true && Number(e.ts) > 0)
          .map((e) => Number(e.ts)).sort((a, b) => a - b);
        if (ons.length) return ons[0];
        if (acct?.mirror_enabled) return Number(acct.enable_changed_at) || Number(acct.connected_at) || null;
        return Number(acct?.enable_changed_at) || null;
      }

      /* ── reject / skip reason humanizer ─────────────────────────── */
      function humanizeReason(raw) {
        const r = String(raw || "").toLowerCase();
        if (!r) return null;
        if (/match within tolerance|within.*tolerance/.test(r)) return "In sync — broker shares match the model";
        if (/duplicate_client_order_id/.test(r)) return "Duplicate order blocked (safety guard)";
        if (/parameter error|invalid client order id|client.?order.?id.*length|length should be between/.test(r)) {
          return "Broker rejected the order id — newer orders use a shorter id";
        }
        if (/max_orders_per_day|daily_cap_hit|daily order cap|orders.*day/.test(r)) {
          return "Legacy daily order limit (removed — mirror on/off is the only account control)";
        }
        if (/notional_.*exceeds_cap|max_per_order|exceeds_cap|vehicle_.*notional/.test(r)) return "Order size above a vehicle dollar limit";
        if (/below_min_share_price/.test(r)) return "Order too small for one share at the limit";
        if (/mirror_suppressed/.test(r)) return "Mirroring suppressed after repeated drift — needs review";
        if (/no_manifest_for_trade/.test(r)) return "No tracked entry for this trade on the account";
        if (/reducer_blocked_by_sync_state:(\w+)/.test(r)) return "Sell blocked — position not in sync (" + r.match(/reducer_blocked_by_sync_state:(\w+)/)[1].replace(/_/g, " ") + ")";
        if (/closer_blocked_by_sync_state/.test(r)) return "Close blocked — position not in sync";
        if (/nothing_to_reduce|reducer_qty_rounded_to_zero/.test(r)) return "Nothing to sell on this account";
        if (/qty_zero|rounded_to_zero/.test(r)) return "Order size rounded to zero for this account";
        if (/insufficient|buying_power/.test(r)) return "Insufficient buying power";
        if (/outside.*market|market.*closed|requires regular market|fractional/.test(r)) return "Requires regular market hours";
        if (/investor_mirror_disabled/.test(r)) return "Long-term mirroring is off globally";
        if (/broker_integration_disabled|mirror_off|not_enabled/.test(r)) return "Mirroring is off for this account";
        if (/zone_exhausted|stage_|score_below/.test(r)) return "Model thesis gate declined the catch-up";
        if (/too many request|rate.?limit/.test(r)) return "Broker rate limit — retried automatically";
        if (/no_hmac_or_url|bridge/.test(r)) return "Mirror bridge unavailable";
        if (/vehicle_.*_disabled/.test(r)) return "This order type is disabled for the account";
        return String(raw).replace(/_/g, " ").slice(0, 120);
      }

      /* ── ticker avatar (deterministic gradient per symbol) ──────── */
      const AVATAR_HUES = [158, 190, 215, 262, 288, 330, 20, 42, 88, 130];
      function TickerAvatar({ ticker, muted }) {
        const t = String(ticker || "?");
        let hash = 0;
        for (let i = 0; i < t.length; i++) hash = (hash * 31 + t.charCodeAt(i)) >>> 0;
        const hue = AVATAR_HUES[hash % AVATAR_HUES.length];
        const bg = muted
          ? "rgba(255,255,255,0.06)"
          : `linear-gradient(135deg, hsl(${hue},72%,62%), hsl(${(hue + 40) % 360},68%,48%))`;
        return (
          <div className="tk-avatar pos-a-av" style={{ background: bg, color: muted ? "var(--tt-text-dim)" : "#0b1410" }}>
            {t.slice(0, 2)}
          </div>
        );
      }

      /* ── SVG donut for sync health ───────────────────────────────── */
      function SyncDonut({ counts }) {
        const total = counts.reduce((s, c) => s + c.n, 0);
        if (!total) return null;
        const R = 26, C = 2 * Math.PI * R;
        let offset = 0;
        return (
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <svg width="68" height="68" viewBox="0 0 68 68" aria-hidden="true">
              <circle cx="34" cy="34" r={R} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="8" />
              {counts.filter((c) => c.n > 0).map((c) => {
                const frac = c.n / total;
                const el = (
                  <circle key={c.label} cx="34" cy="34" r={R} fill="none" stroke={c.color} strokeWidth="8"
                    strokeDasharray={`${frac * C} ${C}`} strokeDashoffset={-offset * C}
                    transform="rotate(-90 34 34)" strokeLinecap="butt" />
                );
                offset += frac;
                return el;
              })}
              <text x="34" y="38" textAnchor="middle" fill="var(--tt-text-1)" fontSize="15" fontWeight="800"
                fontFamily="Manrope, Inter, sans-serif">{total}</text>
            </svg>
            <div style={{ fontSize: 11, lineHeight: 1.8 }}>
              {counts.filter((c) => c.n > 0).map((c) => (
                <div key={c.label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 2, background: c.color, display: "inline-block" }} />
                  <span className="dim">{c.label}</span>
                  <b className="mono" style={{ fontSize: 11 }}>{c.n}</b>
                </div>
              ))}
            </div>
          </div>
        );
      }

      /* ── shared fetch helper ─────────────────────────────────────── */
      async function apiGet(path) {
        const res = await fetch(`${API_BASE}${path}`, { credentials: "include" });
        return res.json().catch(() => null);
      }
      async function apiPost(path, body) {
        const res = await fetch(`${API_BASE}${path}`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        });
        return res.json().catch(() => null);
      }

      /* ══ Today's actions timeline ══════════════════════════════════ */
      const EVENT_STYLE = {
        ENTRY:   { label: "BUY",  color: "var(--tt-success)" },
        DCA_BUY: { label: "DCA BUY", color: "var(--tt-success)" },
        BUY:     { label: "BUY",  color: "var(--tt-success)" },
        TRIM:    { label: "TRIM", color: "var(--tt-warning)" },
        EXIT:    { label: "EXIT", color: "var(--tt-danger)" },
        SELL:    { label: "SELL", color: "var(--tt-danger)" },
      };
      const MIRROR_CHIP = {
        mirrored:     { cls: "p-ok",   label: "MIRRORED" },
        forwarded:    { cls: "p-info", label: "SENT TO BROKER" },
        rejected:     { cls: "p-err",  label: "REJECTED" },
        skipped:      { cls: "p-warn", label: "SKIPPED" },
        auto_sync:    { cls: "p-info", label: "AUTO-SYNC" },
        not_mirrored: { cls: "p-off",  label: "NOT MIRRORED" },
      };
      const MODE_CHIP = {
        investor: { cls: "p-mint", label: "LONG TERM" },
        trader:   { cls: "p-info", label: "SHORT TERM" },
        mirror:   { cls: "p-off",  label: "MIRROR" },
      };

      function ActionRow({ a, isLast, showDay }) {
        const ev = EVENT_STYLE[a.event] || { label: a.event, color: "var(--tt-text-dim)" };
        const mc = MIRROR_CHIP[a.mirror] || MIRROR_CHIP.not_mirrored;
        const reason = humanizeReason(a.mirror_reason);
        const hasDetail = (a.fills && a.fills.length) || (a.rejects && a.rejects.length) || reason || a.note;
        const pnl = Number(a.realized_pnl) || 0;
        return (
          <div>
            {showDay && (
              <div className="dim" style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", padding: "10px 0 4px 26px" }}>
                {fmtDay(a.ts)}
              </div>
            )}
            <div className="tl-row">
              <div className="tl-rail">
                <span className="tl-dot" style={{ background: ev.color }} />
                {!isLast && <span className="tl-line" />}
              </div>
              <div className="tl-main">
                <div className="tl-head">
                  <span className="tl-time mono">{fmtTime(a.ts)}</span>
                  <span className={`bc-pill ${(MODE_CHIP[a.mode] || MODE_CHIP.mirror).cls}`}>{(MODE_CHIP[a.mode] || MODE_CHIP.mirror).label}</span>
                  <span style={{ fontWeight: 800, fontSize: 13, color: ev.color }}>{ev.label}</span>
                  <span style={{ fontWeight: 800, fontSize: 13 }}>{a.ticker}</span>
                  <span className="mono dim" style={{ fontSize: 12 }}>
                    {fmtQty(a.qty)} sh @ {fmtUsd(a.price)}
                  </span>
                  {(a.event === "TRIM" || a.event === "EXIT") && pnl !== 0 && (
                    <span className={`mono ${pnl >= 0 ? "up" : "dn"}`} style={{ fontSize: 12, fontWeight: 700 }}>{fmtSigned(pnl)}</span>
                  )}
                  <span style={{ flex: 1 }} />
                  <span className={`bc-pill ${mc.cls}`}>
                    <span className="dot" />{mc.label}{a.fills?.length > 1 ? ` ×${a.fills.length}` : ""}
                  </span>
                </div>
                {hasDetail && (
                  <div className="tl-detail">
                    {(a.fills || []).map((f, i) => (
                      <div key={"f" + i} className="tl-acct-row">
                        <span style={{ fontWeight: 600 }}>{f.account || "Account"}</span>
                        <span className="mono">{fmtQty(f.qty)} sh @ {fmtUsd(f.price)} <span className="dim">·</span> {fmtUsd(f.value)}</span>
                        <span className="bc-pill p-ok">FILLED</span>
                      </div>
                    ))}
                    {(a.rejects || []).map((r, i) => (
                      <div key={"r" + i} className="tl-acct-row">
                        <span style={{ fontWeight: 600 }}>{r.account || "Account"}</span>
                        <span className="dim" style={{ flex: 1 }}>{humanizeReason(r.reject_reason) || "Rejected"}</span>
                        <span className="bc-pill p-err">REJECTED</span>
                      </div>
                    ))}
                    {!a.fills?.length && !a.rejects?.length && reason && (
                      <div className="dim">{reason}</div>
                    )}
                    {a.note && <div className="dim" style={{ marginTop: 5, fontSize: 11 }}>Model note: {String(a.note).replace(/_/g, " ")}</div>}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      function DayActions({ refreshKey }) {
        const [data, setData] = useState(null);

        useEffect(() => {
          let alive = true;
          (async () => {
            const json = await apiGet("/timed/broker/day-actions?hours=72").catch(() => null);
            if (!alive) return;
            if (json?.ok) setData(json);
            else setData({ ok: false, error: json?.error || "Request failed" });
          })();
          return () => { alive = false; };
        }, [refreshKey]);

        const actions = data?.actions || [];
        const s = data?.summary || {};
        const firstOnByLabel = useMemo(() => {
          const m = new Map();
          for (const a of data?.accounts || []) {
            const on = firstMirrorOnTs(a);
            if (on && a.label) m.set(a.label, on);
            if (on && a.account_id) m.set(a.account_id, on);
          }
          return m;
        }, [data]);
        const tagged = useMemo(() => actions.map((a) => {
          const ts = Number(a.ts) || 0;
          const labels = [a.account, ...(a.fills || []).map((f) => f.account), ...(a.rejects || []).map((r) => r.account)].filter(Boolean);
          const pre = labels.length
            ? labels.every((lb) => firstOnByLabel.get(lb) && ts < firstOnByLabel.get(lb))
            : false;
          return pre ? { ...a, mirror: "auto_sync", pre_mirror: true } : a;
        }), [actions, firstOnByLabel]);
        const groups = useMemo(() => {
          const map = new Map();
          for (const a of tagged) {
            const key = nyDateKey(a.ts);
            if (!map.has(key)) map.set(key, []);
            map.get(key).push(a);
          }
          return [...map.entries()].sort((x, y) => (y[1][0]?.ts || 0) - (x[1][0]?.ts || 0));
        }, [tagged]);
        const todayKey = nyDateKey(Date.now());
        // Always expand today; collapse the previous two sessions by default.
        // When today has no actions yet, expand the most recent day instead.
        const hasToday = !!groups.find(([k]) => k === todayKey)?.[1]?.length;
        const expandKey = hasToday ? todayKey : (groups[0]?.[0] || todayKey);

        return (
          <section className="tt-card tt-card-pad" style={{ marginBottom: 18 }}>
            <div className="sec-head">
              <div>
                <div className="tt-sec-title">Last 3 days</div>
                <div className="tt-sec-h" style={{ fontSize: 18 }}>Model actions & mirror outcomes</div>
              </div>
            </div>
            <p className="dim" style={{ fontSize: 12, margin: "0 0 10px", lineHeight: 1.6 }}>
              Every trade the model executed, whether the mirror followed on the connected accounts, and why when it did not.
              Today stays expanded; the previous two sessions collapse — tap to expand.
            </p>
            {data === null && (
              <div>
                {[0, 1, 2].map((i) => <div key={i} className="skel" style={{ height: 38, marginBottom: 8 }} />)}
              </div>
            )}
            {data?.ok === false && <div className="msg-err">Could not load the timeline: {data.error}</div>}
            {data?.ok && tagged.length === 0 && (
              <div className="dim" style={{ fontSize: 13, padding: "14px 0" }}>
                No model actions in this window. The timeline fills in as the model trades.
              </div>
            )}
            {data?.ok && groups.map(([key, rows]) => {
              const expanded = key === expandKey;
              const head = (
                <div className="tl-day-h">
                  {fmtDay(rows[0].ts)} · {rows.length} action{rows.length === 1 ? "" : "s"}
                  {key === todayKey ? " · today" : ""}
                </div>
              );
              const list = (
                <div className="tl">
                  {rows.map((a, i) => <ActionRow key={key + i} a={a} isLast={i === rows.length - 1} showDay={false} />)}
                </div>
              );
              if (expanded) {
                return <div key={key} className="fade-in">{head}{list}</div>;
              }
              return (
                <details key={key} className="tl-day-coll">
                  <summary>
                    <span>{fmtDay(rows[0].ts)} · {rows.length} action{rows.length === 1 ? "" : "s"}</span>
                  </summary>
                  {list}
                </details>
              );
            })}
            {data?.ok && tagged.length > 0 && (
              <div className="dim" style={{ fontSize: 11, marginTop: 10 }}>
                {s.mirrored || 0} mirrored · {s.rejected || 0} rejected · {s.skipped || 0} skipped
                {Number(s.realized_pnl) !== 0 && (
                  <span> · realized <b className={`mono ${s.realized_pnl >= 0 ? "up" : "dn"}`}>{fmtSigned(s.realized_pnl)}</b> (model)</span>
                )}
              </div>
            )}
          </section>
        );
      }

      /* ══ Positions per account ═════════════════════════════════════ */
      const SYNC_CHIP = {
        in_sync:           { cls: "p-ok",   label: "IN SYNC" },
        pending:           { cls: "p-warn", label: "PENDING" },
        partial_fill:      { cls: "p-warn", label: "PARTIAL FILL" },
        broker_orphan:     { cls: "p-err",  label: "AT BROKER ONLY" },
        mothership_orphan: { cls: "p-err",  label: "MISSING HERE" },
        reconcile_error:   { cls: "p-warn", label: "CHECK FAILED" },
        mirror_suppressed: { cls: "p-off",  label: "SUPPRESSED" },
        untracked:         { cls: "p-off",  label: "NOT MIRRORED" },
        not_synced:        { cls: "p-warn", label: "NOT SYNCED" },
        auto_sync:         { cls: "p-info", label: "AUTO-SYNC" },
      };
      const HIST_CHIP = {
        buy: { cls: "p-ok", label: "BUY" }, trim: { cls: "p-warn", label: "TRIM" },
        sell: { cls: "p-err", label: "SELL" }, exit: { cls: "p-err", label: "EXIT" },
        close: { cls: "p-err", label: "CLOSE" },
      };

      function dailyChangeFor(it) {
        if (!(Number(it.price) > 0)) return { dayPct: null, dayChg: null };
        try {
          const t = {
            price: it.price, close: it.price, _live_price: it.price,
            prev_close: it.prev_close, day_change: it.day_change, day_change_pct: it.day_change_pct,
          };
          const dc = PU.getDailyChange ? PU.getDailyChange(t) : { dayPct: null, dayChg: null };
          return dc || { dayPct: null, dayChg: null };
        } catch (_) { return { dayPct: null, dayChg: null }; }
      }

      // Safety net if the backend ever sends a decimal fraction; recompute from
      // price and avg_cost when both are known so the row is always right.
      function computeUpnlPct(it) {
        const px = Number(it.price) > 0 ? Number(it.price)
          : (Number(it.last_price) > 0 ? Number(it.last_price) : NaN);
        const avg = Number(it.avg_cost);
        if (Number.isFinite(px) && Number.isFinite(avg) && avg > 0) {
          return ((px / avg) - 1) * 100;
        }
        const raw = Number(it.unrealized_pnl_pct);
        if (!Number.isFinite(raw)) return NaN;
        return Math.abs(raw) < 1 && raw !== 0 ? raw * 100 : raw;
      }

      // Kanban-style plan bar: SL / entry (model + broker) / current / TP.
      // Renders when the position is managed and enough anchors exist.
      function PositionPlanBar({ it }) {
        const px = Number(it.price) > 0 ? Number(it.price) : Number(it.last_price);
        const brokerEntry = Number(it.avg_cost) > 0 ? Number(it.avg_cost) : null;
        const modelEntry = Number(it.model_entry) > 0 ? Number(it.model_entry) : null;
        const sl = Number(it.model_sl) > 0 ? Number(it.model_sl) : null;
        const tp = Number(it.model_tp) > 0 ? Number(it.model_tp)
          : (Number(it.model_peak) > 0 ? Number(it.model_peak) : null);
        const anchors = [px, brokerEntry, modelEntry, sl, tp].filter((v) => Number.isFinite(v) && v > 0);
        if (anchors.length < 2 || !Number.isFinite(px)) return null;
        const lo = Math.min(...anchors) * 0.985;
        const hi = Math.max(...anchors) * 1.015;
        const span = Math.max(1e-6, hi - lo);
        const pctFor = (v) => Math.max(0, Math.min(100, ((v - lo) / span) * 100));
        const entryRef = modelEntry || brokerEntry;
        const up = entryRef ? px >= entryRef : true;
        const track = { position: "relative", height: 6, borderRadius: 999, background: "rgba(255,255,255,0.06)", margin: "6px 0 2px" };
        const zoneStyle = {
          position: "absolute", top: 0, bottom: 0, borderRadius: 999,
          background: up ? "rgba(52,211,153,0.28)" : "rgba(239,68,68,0.28)",
        };
        const zoneL = entryRef ? Math.min(pctFor(entryRef), pctFor(px)) : 0;
        const zoneR = entryRef ? Math.max(pctFor(entryRef), pctFor(px)) : pctFor(px);
        const marker = (v, color, label, extra) => v == null ? null : (
          <div key={label} style={{
            position: "absolute", left: `${pctFor(v)}%`, top: -1, bottom: -1,
            width: 2, background: color, transform: "translateX(-1px)", ...extra,
          }} title={`${label}: ${fmtUsd(v)}`} />
        );
        return (
          <div className="plan-bar" style={{ marginTop: 6 }}>
            <div style={track}>
              <div style={{ ...zoneStyle, left: `${zoneL}%`, width: `${Math.max(1, zoneR - zoneL)}%` }} />
              {marker(sl, "var(--tt-danger)", "Stop / invalidation")}
              {marker(brokerEntry, "rgba(255,255,255,0.55)", "Broker entry")}
              {marker(modelEntry, "var(--vf-primary, #38F2A1)", "Model entry")}
              {marker(tp, "var(--tt-info, #67e8f9)", it.model_horizon === "investor" ? "Peak" : "Target")}
              <div style={{
                position: "absolute", left: `${pctFor(px)}%`, top: -3, bottom: -3,
                width: 10, height: 10, borderRadius: "50%",
                background: up ? "var(--tt-success)" : "var(--tt-danger)",
                boxShadow: "0 0 0 2px rgba(11,20,16,0.9)",
                transform: "translateX(-5px)",
              }} title={`Now: ${fmtUsd(px)}`} />
            </div>
            <div className="mono dim" style={{ fontSize: 10, display: "flex", justifyContent: "space-between", marginTop: 3 }}>
              <span>{sl != null ? `SL ${fmtUsd(sl)}` : ""}</span>
              <span>
                {modelEntry != null ? `Model ${fmtUsd(modelEntry)}` : ""}
                {modelEntry != null && brokerEntry != null && Math.abs(brokerEntry - modelEntry) > 0.005 ? " · " : ""}
                {(brokerEntry != null && (!modelEntry || Math.abs(brokerEntry - modelEntry) > 0.005)) ? `Broker ${fmtUsd(brokerEntry)}` : ""}
              </span>
              <span>{tp != null ? `${it.model_horizon === "investor" ? "Peak" : "TP"} ${fmtUsd(tp)}` : ""}</span>
            </div>
          </div>
        );
      }

      // Client-side guidance derived from model_stage + horizon + price vs entry.
      // Kept in-page so the user always sees a plain-English "what the model
      // is doing now" line without another server call.
      function positionGuidance(it) {
        const stage = String(it.model_stage || "").toLowerCase();
        const horizon = String(it.model_horizon || "").toLowerCase();
        const px = Number(it.price) > 0 ? Number(it.price) : Number(it.last_price);
        const entry = Number(it.model_entry) > 0 ? Number(it.model_entry) : Number(it.avg_cost);
        const above = Number.isFinite(px) && Number.isFinite(entry) && entry > 0 ? px >= entry : null;
        if (it.auto_sync && !(Number(it.broker_qty) > 0.0001)) {
          return { text: "Model holds this; the mirror buys in on the next natural window (DCA / catch-up).", tone: "mint" };
        }
        if (it.adoptable) {
          return { text: "Bought outside the model — Sync to hand a model-sized sleeve to the mirror.", tone: "mint" };
        }
        if (!it.managed) return null;
        if (horizon === "investor") {
          if (stage === "accumulate") return { text: above ? "Accumulating — already above entry; adds only in-zone." : "Accumulating in the entry zone — more adds if it holds.", tone: "mint" };
          if (stage === "reduce") return { text: "Reducing risk — trims triggered by the model's rules.", tone: "warn" };
          if (stage === "watch" || stage === "core_hold") return { text: above ? "Holding for target — model rides while structure holds." : "Holding through the pullback — no adds, no trims.", tone: "info" };
          if (stage === "trim") return { text: "Trim near target — banking gains while momentum holds.", tone: "warn" };
          if (stage === "exit") return { text: "Exit signal fired — the mirror closes on the next window.", tone: "danger" };
          return { text: above ? "Winning position — riding to the model's target." : "Managed long-term hold below entry — waiting for structure.", tone: above ? "info" : "warn" };
        }
        // Trader
        if (above) return { text: "Riding to the target; SL trails the model's plan.", tone: "mint" };
        if (above === false) return { text: "Underwater vs entry — SL still armed by the model.", tone: "warn" };
        return { text: "Fresh entry — SL and TP set from the setup plan.", tone: "info" };
      }

      const HORIZON_CHIP = {
        investor: { cls: "p-mint", label: "LONG TERM" },
        trader:   { cls: "p-info", label: "SHORT TERM" },
      };

      function PositionRow({ it, acct, onSync, syncBusy, onSelectTicker }) {
        const [open, setOpen] = useState(false);
        const chip = it.auto_sync && !it.managed
          ? SYNC_CHIP.auto_sync
          : (SYNC_CHIP[it.sync_state] || { cls: "p-warn", label: String(it.sync_state || "?").toUpperCase() });
        const qty = Number(it.broker_qty) || 0;
        const holds = qty > 0.0001;
        const upnl = Number(it.unrealized_pnl);
        const upnlPct = computeUpnlPct(it);
        const dc = dailyChangeFor(it);
        const hasDetail = (it.history && it.history.length) || it.sync_note || it.adoptable || it.auto_sync || (!it.managed && !it.model_open);
        const showPlanBar = it.managed && holds && Number(it.model_entry) > 0;
        const barPct = Number.isFinite(upnlPct) ? Math.max(-20, Math.min(20, upnlPct)) : 0;
        const syncNoteHuman = it.sync_note
          ? (humanizeReason(it.sync_note) || String(it.sync_note).replace(/_/g, " "))
          : null;
        const guide = positionGuidance(it);
        const horizonChip = it.managed && HORIZON_CHIP[String(it.model_horizon || "").toLowerCase()];
        const upBadge = Number.isFinite(upnl) && upnl > 0 ? "up" : (Number.isFinite(upnl) && upnl < 0 ? "dn" : "flat");
        const openResearch = (e) => {
          e?.stopPropagation?.();
          if (typeof onSelectTicker === "function" && it.ticker) onSelectTicker(it.ticker);
        };
        return (
          <div className={`pos-card pos-card--${holds ? upBadge : "flat"}`}>
            <div className="pos-row" style={hasDetail ? { cursor: "pointer" } : null}
              onClick={() => hasDetail && setOpen((v) => !v)}
              role={hasDetail ? "button" : undefined}>
              <button type="button" title={`Open research for ${it.ticker}`}
                onClick={openResearch}
                style={{ border: "none", cursor: "pointer", padding: 0, background: "transparent", borderRadius: 10, lineHeight: 0 }}>
                <TickerAvatar ticker={it.ticker} muted={!holds} />
              </button>
              <div className="pos-a-tick" style={{ minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                  <button type="button" className="pos-ticker-btn" title={`Open research for ${it.ticker}`}
                    onClick={openResearch}>{it.ticker}</button>
                  {holds && it.managed && (
                    <span className="bc-pill p-ok" title="Model-managed long position">Open {String(it.model_direction || "LONG").toUpperCase() === "SHORT" ? "Short" : "Long"}</span>
                  )}
                  {horizonChip && <span className={`bc-pill ${horizonChip.cls}`}>{horizonChip.label}</span>}
                  {it.adoptable && <span className="bc-pill p-mint">CAN SYNC</span>}
                  {it.auto_sync && !it.adoptable && !holds && <span className="bc-pill p-mint">MODEL HOLDS</span>}
                  {hasDetail && (
                    <span className="dim" style={{ fontSize: 10, fontWeight: 600 }}>{open ? "▾" : "▸"}</span>
                  )}
                </div>
                <div className="mono dim" style={{ fontSize: 11, marginTop: 2 }}>
                  {holds ? `${fmtQty(qty)} sh${Number(it.avg_cost) > 0 ? ` @ ${fmtUsd(it.avg_cost)}` : ""}` : "no shares here"}
                </div>
              </div>
              <div className="pos-a-px mono" style={{ fontSize: 12.5 }}>
                {Number(it.price) > 0 || Number(it.last_price) > 0 ? (
                  <div>
                    <div>{fmtUsd(Number(it.price) > 0 ? it.price : it.last_price)}</div>
                    {(() => {
                      const marketOpen = PU.isNyRegularMarketOpen ? PU.isNyRegularMarketOpen() : false;
                      const showPct = Number.isFinite(dc.dayPct) && dc.dayPct !== null

                        </div>

                    })()}
                  </div>
                ) : <span className="dim">—</span>}
              </div>
              <div className="pos-a-val mono" style={{ fontSize: 12.5 }}>
                {Number(it.market_value) > 0 ? fmtUsd(it.market_value) : <span className="dim">—</span>}
              </div>
              <div className="pos-a-pnl" style={{ minWidth: 0 }}>
                {Number.isFinite(upnl) ? (
                  <div>
                    <span className={`mono ${upnl >= 0 ? "up" : "dn"}`} style={{ fontSize: 12.5, fontWeight: 700 }}>
                      {fmtSigned(upnl)}{Number.isFinite(upnlPct) ? ` (${upnlPct >= 0 ? "+" : ""}${upnlPct.toFixed(1)}%)` : ""}
                    </span>
                    <div className="pnl-bar">
                      <span style={{
                        background: upnl >= 0 ? "var(--tt-success)" : "var(--tt-danger)",
                        left: barPct >= 0 ? "50%" : `${50 + barPct * 2.5}%`,

              <div className="pos-a-sync" style={{ textAlign: "right" }}>

            {showPlanBar && <PositionPlanBar it={it} />}
            {guide && (

                <span className="g-icon" title="Model guidance">i</span>

              </div>
            )}
            {open && hasDetail && (
              <div className="pos-detail fade-in" onClick={(e) => e.stopPropagation()}>

                  <div className="dim" style={{ fontSize: 12, lineHeight: 1.6, marginBottom: it.history?.length ? 10 : 0 }}>
                    The model holds this position; this account is flat. The mirror picks it up
                    automatically during the model's natural buy windows — a DCA add or a catch-up
                    pass that clears the model's own entry gates. Sync is never forced with a
                    standalone order, so nothing needs to be done here.
                  </div>
                )}
                {it.adoptable && (
                  <div style={{ marginBottom: it.history?.length ? 10 : 0 }}>
                    <div className="dim" style={{ fontSize: 12, lineHeight: 1.6, marginBottom: 8 }}>
                      These shares were bought outside the model (different entry, different size).
                      Syncing places <b>no order</b> — a model-sized portion of the shares held here
                      becomes model-managed: every future model action (trims, stop moves, exits,
                      adds) mirrors to this account based on the model's own entry and signals, not
                      this account's cost basis. A model exit can close the managed portion at a
                      loss relative to this account's entry. Shares above the model's sizing stay
                      user-owned and untouched.
                    </div>
                    {it.adopt_note === "mirror_off" && (
                      <div className="dim" style={{ fontSize: 11, marginBottom: 8 }}>

                      </div>
                    )}
                    <button className="bc-btn bc-btn-sm bc-btn-primary" disabled={syncBusy}
                      onClick={() => {
                        if (confirm(`Sync ${it.ticker} with the model?\n\nNo order is placed. A model-sized portion of the ${fmtQty(qty)} shares held becomes model-managed and will follow every future model action — including exits that may close it at a loss relative to this account's entry of ${Number(it.avg_cost) > 0 ? fmtUsd(it.avg_cost) : "n/a"}. Shares above the model's sizing stay user-owned.`)) {
                          onSync(it.ticker);
                        }
                      }}>
                      {syncBusy ? "Syncing…" : "Sync with model"}

                  <div className="dim" style={{ fontSize: 12, lineHeight: 1.6, marginBottom: it.history?.length ? 10 : 0 }}>

                    orders against it — no action available.
                  </div>

                {syncNoteHuman && it.managed && (
                  <div className="dim" style={{ fontSize: 11, marginBottom: it.history?.length ? 8 : 0 }}>

                  <div>
                    <div className="lbl" style={{ margin: "0 0 4px" }}>Account history</div>

                        (String(hrow.event_type || "").includes("EXIT") ? HIST_CHIP.exit : HIST_CHIP.buy);
                      const failed = hrow.status && hrow.status !== "ok" && hrow.status !== "filled";
                      const firstOn = firstMirrorOnTs(acct);
                      const preMirror = !failed && firstOn && Number(hrow.ts) < firstOn;
                      return (

      function PositionsSection({ refreshKey, onData, onSelectTicker }) {
        const [data, setData] = useState(null);
        const [err, setErr] = useState(null);
        const [syncBusyFor, setSyncBusyFor] = useState(null);
        const [syncMsg, setSyncMsg] = useState(null);
        const [reloadTick, setReloadTick] = useState(0);

        useEffect(() => {
          let alive = true;
          (async () => {
            const json = await apiGet("/timed/broker/positions").catch(() => null);
            if (!alive) return;
            if (json?.ok) { setData(json); setErr(null); onData && onData(json); }
            else { setData({ accounts: [] }); setErr(json?.error || "Request failed"); }
          })();
          return () => { alive = false; };
        }, [refreshKey, reloadTick]);

        const doSync = async (accountId, ticker) => {
          setSyncBusyFor(`${accountId}:${ticker}`);
          setSyncMsg(null);
          try {
            const json = await apiPost("/timed/broker/sync-position", { account_id: accountId, ticker });
            if (json?.ok) {
              setSyncMsg({ ok: true, text: json?.note || `${ticker} is now model-managed.` });
              setTimeout(() => setReloadTick((x) => x + 1), 1200);
            } else {
              setSyncMsg({ ok: false, text: json?.note || humanizeReason(json?.error) || "Sync failed" });
            }
          } catch (e) {
            setSyncMsg({ ok: false, text: String(e?.message || e) });
          } finally { setSyncBusyFor(null); }
        };

        const accounts = data?.accounts || [];
        // Donut counts the actual rendered rows across all accounts, deduped
        // to unique tickers so a position mirrored to 5 accounts counts once.
        // Auto-sync orphans (model holds, account flat) are their own bucket —
        // they're not "not mirrored", they're waiting for a natural buy window.
        const donutCounts = useMemo(() => {
          const inSync = new Set();
          const attention = new Set();
          const autoSync = new Set();
          const untracked = new Set();
          for (const a of accounts) {
            const mirrorOn = a.mirror_enabled === true;
            for (const it of a.items || []) {
              const sym = String(it.ticker || "").toUpperCase();
              if (!sym) continue;
              const held = Number(it.broker_qty) > 0.0001;
              // Mirror-off accounts contribute only broker holdings.
              if (!mirrorOn && !held) continue;
              const st = String(it.sync_state || "");
              if (mirrorOn && it.auto_sync && !held) { autoSync.add(sym); continue; }
              if (!it.managed && held) { untracked.add(sym); continue; }
              if (st === "in_sync") { inSync.add(sym); continue; }
              if (it.managed) { attention.add(sym); continue; }
            }
          }
          // Prevent double-counting: managed IN SYNC wins over any other bucket.
          for (const s of inSync) { attention.delete(s); autoSync.delete(s); untracked.delete(s); }
          return [
            { label: "In sync", n: inSync.size, color: "var(--tt-success)" },
            { label: "Attention", n: attention.size, color: "var(--tt-warning)" },
            { label: "Auto-sync", n: autoSync.size, color: "var(--vf-primary, #38F2A1)" },
            { label: "Not mirrored", n: untracked.size, color: "rgba(255,255,255,0.25)" },
          ];
        }, [accounts]);

        return (
          <section className="tt-card tt-card-pad" style={{ marginBottom: 18 }}>
            <div className="sec-head">
              <div>
                <div className="tt-sec-title">Positions</div>
                <div className="tt-sec-h" style={{ fontSize: 18 }}>Holdings & sync manifest</div>
              </div>
              <SyncDonut counts={donutCounts} />
            </div>
            <p className="dim" style={{ fontSize: 12, margin: "0 0 6px", lineHeight: 1.6 }}>
              Each account's holdings against the model book, with action history inline.
              AUTO-SYNC positions fill in on the model's own buy windows — sync is never forced.
              User-bought positions the model also holds can be handed to the model (CAN SYNC, no
              order placed); broker-only holdings are never touched. Accounts with mirroring off
              show holdings only — no sync-manifest outcomes.
            </p>
            {data?.prices_included === false && (
              <div className="dim" style={{ fontSize: 11, marginBottom: 8 }}>
                Intraday change % from the market-data feed requires Pro — Model P&L and last price use the broker's own marks.
              </div>
            )}
            {syncMsg && <div className={syncMsg.ok ? "msg-ok" : "msg-err"} style={{ margin: "6px 0" }}>{syncMsg.text}</div>}
            {err && <div className="msg-err" style={{ marginBottom: 8 }}>{err}</div>}
            {data === null && [0, 1].map((i) => <div key={i} className="skel" style={{ height: 90, marginBottom: 10 }} />)}
            {data !== null && accounts.length === 0 && !err && (
              <div className="dim" style={{ fontSize: 13 }}>No connected accounts yet.</div>
            )}
            {accounts.map((acct) => (
              <div key={acct.account_id} style={{ marginBottom: 20 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 2 }}>
                  <span style={{ fontSize: 13, fontWeight: 800 }}>{acct.label || acct.account_id}</span>
                  {!acct.mirror_enabled && <span className="bc-pill p-off">MIRROR OFF</span>}
                  {acct.positions_stale && (
                    <span className="bc-pill p-warn" title={humanizeReason(acct.positions_stale_reason) || ""}>
                      AS OF {minsAgo(acct.positions_as_of)}M AGO
                    </span>
                  )}
                </div>
                {(acct.summary?.positions_value > 0 || Number.isFinite(acct.summary?.day_pnl)) && (
                  <div className="acct-summary mono">
                    {acct.summary.positions_value > 0 && <span>Value <b>{fmtUsd(acct.summary.positions_value)}</b></span>}
                    {Number.isFinite(acct.summary.day_pnl) && acct.summary.day_pnl !== null && (
                      <span>Today <b className={acct.summary.day_pnl >= 0 ? "up" : "dn"}>{fmtSigned(acct.summary.day_pnl)}</b></span>
                    )}
                    {Number.isFinite(acct.summary.unrealized_pnl) && acct.summary.unrealized_pnl !== null && (
                      <span>Open P&L <b className={acct.summary.unrealized_pnl >= 0 ? "up" : "dn"}>{fmtSigned(acct.summary.unrealized_pnl)}</b></span>
                    )}
                  </div>
                )}
                {acct.positions_error && (
                  <div className="msg-err" style={{ fontSize: 12, margin: "6px 0" }}>
                    Broker positions unavailable right now ({humanizeReason(acct.positions_error)}). The view retries automatically.
                  </div>
                )}
                {(acct.items || []).length === 0 && !acct.positions_error && (
                  <div className="dim" style={{ fontSize: 12, padding: "6px 0" }}>No positions.</div>
                )}
                {(() => {
                  // Mirror-off accounts: holdings only — hide AUTO-SYNC / model-orphan
                  // sync outcomes (those only matter when the account can receive orders).
                  const rows = (acct.items || []).filter((it) => {
                    if (acct.mirror_enabled) return true;
                    if (it.auto_sync && !(Number(it.broker_qty) > 0.0001)) return false;
                    if (!it.managed && it.model_open && !(Number(it.broker_qty) > 0.0001)) return false;
                    return Number(it.broker_qty) > 0.0001 || it.managed;
                  });
                  if (!rows.length) return null;
                  return (
                  <div>
                    <div className="pos-head">
                      <span />
                      <span>Position</span><span>Price</span><span>Value</span><span>Open P&L</span><span style={{ textAlign: "right" }}>Sync</span>
                    </div>
                    {rows.map((it) => (
                      <PositionRow key={it.ticker} it={{
                        ...it,
                        // Never surface auto_sync chrome on a paused account.
                        auto_sync: acct.mirror_enabled ? it.auto_sync : false,
                        adoptable: acct.mirror_enabled ? it.adoptable : false,
                      }} acct={acct}
                        syncBusy={syncBusyFor === `${acct.account_id}:${it.ticker}`}
                        onSync={(tk) => doSync(acct.account_id, tk)}
                        onSelectTicker={onSelectTicker} />
                    ))}
                  </div>
                  );
                })()}
              </div>
            ))}
          </section>
        );
      }

      /* ══ Account cards (mirror toggle only — no order caps) ════════ */

              <div>
                <div style={{ fontWeight: 800, fontSize: 15, fontFamily: "Manrope, Inter, sans-serif" }}>

                </div>
                <div className="mono dim" style={{ fontSize: 11, marginTop: 3 }}>

                  onClick={() => {

      /* ══ Connect form ══════════════════════════════════════════════ */

        );

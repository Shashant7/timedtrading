      /* ══ Portfolio growth (Robinhood-style equity curve) ══════════ */
      const EQ_RANGES = [
        { id: "1D", ms: 86400000 },
        { id: "1W", ms: 7 * 86400000 },
        { id: "1M", ms: 30 * 86400000 },
        { id: "3M", ms: 90 * 86400000 },
        { id: "YTD", ms: "ytd" },
        { id: "ALL", ms: 0 },
      ];
      function rangeStartMs(id) {
        const now = Date.now();
        if (id === "YTD") {
          const ny = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
          return new Date(ny.getFullYear(), 0, 1).getTime();
        }
        const spec = EQ_RANGES.find((r) => r.id === id);
        const ms = spec && typeof spec.ms === "number" ? spec.ms : 0;
        return ms > 0 ? now - ms : 0;
      }
      /** Wall-clock ms for an America/New_York clock time on the NY calendar day of `now`. */
      function nyWallClockMs(hour, minute, now = Date.now()) {
        const ny = new Date(new Date(now).toLocaleString("en-US", { timeZone: "America/New_York" }));
        const target = new Date(ny);
        target.setHours(hour, minute, 0, 0);
        return now - (ny.getTime() - target.getTime());
      }
      function matchLiveAccount(curveAcct, liveAccounts) {
        return (liveAccounts || []).find((p) =>
          (curveAcct.user_id && p.account_id === curveAcct.user_id)
          || (curveAcct.broker_account_id && (p.broker_account_id === curveAcct.broker_account_id || p.webull_account_id === curveAcct.broker_account_id))
          || (curveAcct.label && p.label === curveAcct.label));
      }
      /** Day P&L for the chart's selected accounts — same broker marks the KPI uses. */
      function dayPnlForSelected(selected, liveAccounts) {
        let sum = 0, has = false;
        for (const a of selected) {
          const live = matchLiveAccount(a, liveAccounts);
          if (!live) continue;
          let itemSum = 0, itemN = 0;
          for (const it of live.items || []) {
            if (!(Number(it.broker_qty) > 0.0001)) continue;
            if (Number.isFinite(Number(it.day_pnl))) { itemSum += Number(it.day_pnl); itemN++; }
          }
          if (itemN) { sum += itemSum; has = true; continue; }
          if (Number.isFinite(live.summary?.day_pnl) && live.summary.day_pnl !== null) {
            sum += Number(live.summary.day_pnl);
            has = true;
          }
        }
        return has ? sum : null;
      }
      /**
       * Robinhood-style 1D path: when equity history is flat overnight (common
       * after the close), rebuild from prior close = liveEquity − dayPnl so the
       * chart delta matches Today's P&L instead of reading +$0.00.
       */
      function buildDayPath(points, liveEq, dayPnl) {
        const now = Date.now();
        const lastEq = Number.isFinite(liveEq)
          ? liveEq
          : (points.length ? points[points.length - 1].equity : null);
        if (!Number.isFinite(lastEq) || !Number.isFinite(dayPnl)) return { points, delta: null };
        const prior = lastEq - dayPnl;
        const eqs = points.map((p) => p.equity);
        const span = eqs.length ? Math.max(...eqs) - Math.min(...eqs) : 0;
        const flat = span < Math.max(1, Math.abs(dayPnl) * 0.08);
        const rthOpen = nyWallClockMs(9, 30, now);
        const rthClose = nyWallClockMs(16, 0, now);
        if (flat) {
          // Prior session already closed: draw the session move, then hold to now.
          if (now > rthClose) {
            return {
              points: [
                { ts: rthOpen, equity: prior },
                { ts: rthClose, equity: lastEq },
                { ts: now, equity: lastEq },
              ],
              delta: dayPnl,
            };
          }
          if (now >= rthOpen) {
            return {
              points: [
                { ts: rthOpen, equity: prior },
                { ts: now, equity: lastEq },
              ],
              delta: dayPnl,
            };
          }
          // Premarket — day_pnl is still yesterday's session.
          return {
            points: [
              { ts: rthOpen - 86400000, equity: prior },
              { ts: rthClose - 86400000, equity: lastEq },
              { ts: now, equity: lastEq },
            ],
            delta: dayPnl,
          };
        }
        // Real intraday samples exist — keep them, but pin the open to prior close
        // so the headline delta matches the KPI.
        const pinned = [{ ts: Math.min(points[0]?.ts || rthOpen, rthOpen), equity: prior }];
        for (const p of points) {
          if (p.ts <= pinned[0].ts) continue;
          pinned.push(p);
        }
        if (!pinned.length || pinned[pinned.length - 1].ts < now - 1000) {
          pinned.push({ ts: now, equity: lastEq });
        } else {
          pinned[pinned.length - 1] = { ...pinned[pinned.length - 1], equity: lastEq, ts: now };
        }
        return { points: pinned, delta: dayPnl };
      }
      function combineForwardFill(accts, sinceTs) {
        // Anchor the curve on each account's mirror-on marker when history
        // is sparse — otherwise every range renders the same one-point line
        // and the toggle looks broken. The anchor uses the earliest recorded
        // equity for that account so the line reads as "since mirror on".
        const enriched = accts.map((a) => {
          const pts = [...(a.points || [])].sort((x, y) => x.ts - y.ts);
          const firstOn = (a.markers || []).find((m) => m.on)?.ts;
          if (firstOn && pts.length && pts[0].ts > firstOn) {
            pts.unshift({ ts: firstOn, equity: pts[0].equity });
          }
          return pts;
        });
        // Seed each series at the window start with the last sample BEFORE
        // sinceTs. Without this, 1W/1M collapse onto today's flat stamps and
        // both axis labels read the same day.
        const series = enriched.map((pts) => {
          if (!sinceTs) return pts;
          let seed = null;
          for (const p of pts) {
            if (p.ts < sinceTs) seed = p;
            else break;
          }
          const inWindow = pts.filter((p) => p.ts >= sinceTs);
          // A very old sample is not a valid baseline for a short period.
          // (E.g. a 40-day-old point must not become "1D P&L".)
          const windowMs = Math.max(86400000, Date.now() - sinceTs);
          const seedFreshEnough = seed && (sinceTs - seed.ts) <= windowMs;
          if (seedFreshEnough) return [{ ts: sinceTs, equity: seed.equity }, ...inWindow];
          return inWindow;
        });
        const allTs = new Set();
        for (const s of series) for (const p of s) allTs.add(p.ts);
        const tsList = [...allTs].sort((a, b) => a - b);
        const last = accts.map(() => null);
        const idx = accts.map(() => 0);
        const out = [];
        for (const ts of tsList) {
          let sum = 0, any = false;
          accts.forEach((_, i) => {
            const pts = series[i];
            while (idx[i] < pts.length && pts[idx[i]].ts <= ts) {
              last[i] = pts[idx[i]].equity;
              idx[i]++;
            }
            if (last[i] != null) { sum += last[i]; any = true; }
          });
          if (any) out.push({ ts, equity: sum });
        }
        // If the selected window ends up empty (e.g. 1D but data only exists
        // yesterday), fall back to the full range so the chart still shows.
        if (!out.length && enriched.some((p) => p.length)) {
          return combineForwardFill(accts, 0);
        }
        return out;
      }
      /**
       * Multi-day ranges (1W/1M/…): pin the axis to the full window and, when
       * reconciler samples are flat (common early on / overnight), rebuild the
       * visible move from broker day_pnl so 1W doesn't collapse to a blank
       * same-day line.
       */
      function buildRangePath(points, liveEq, dayPnl, sinceTs) {
        const now = Date.now();
        const lastEq = Number.isFinite(liveEq)
          ? liveEq
          : (points.length ? points[points.length - 1].equity : null);
        if (!Number.isFinite(lastEq)) return { points, delta: null, axisStart: sinceTs || null, axisEnd: now };

        let pts = points.length ? points.map((p) => ({ ...p })) : [{ ts: now, equity: lastEq }];
        const windowStart = sinceTs > 0 ? sinceTs : pts[0].ts;
        if (pts[0].ts > windowStart) {
          pts.unshift({ ts: windowStart, equity: pts[0].equity });
        } else if (pts[0].ts < windowStart) {
          // Keep the seeded window-start point; drop anything earlier.
          const seedEq = pts[0].equity;
          pts = [{ ts: windowStart, equity: seedEq }, ...pts.filter((p) => p.ts >= windowStart)];
        }
        if (pts[pts.length - 1].ts < now - 500) {
          pts.push({ ts: now, equity: lastEq });
        } else {
          pts[pts.length - 1] = { ts: now, equity: lastEq };
        }

        const eqs = pts.map((p) => p.equity);
        const span = Math.max(...eqs) - Math.min(...eqs);
        const flat = span < Math.max(1, Math.abs(Number(dayPnl) || 0) * 0.08);

        if (flat && Number.isFinite(dayPnl) && Math.abs(dayPnl) >= 0.005) {
          // Sparse/flat history: the only observable move is today's day_pnl.
          // Hold prior close across the window, then draw today's session.
          const prior = lastEq - dayPnl;
          const rthOpen = nyWallClockMs(9, 30, now);
          const rthClose = nyWallClockMs(16, 0, now);
          const built = [{ ts: windowStart, equity: prior }];
          const openTs = Math.max(windowStart, Math.min(rthOpen, now));
          if (openTs > windowStart) built.push({ ts: openTs, equity: prior });
          if (now > rthClose && rthClose > openTs) {
            built.push({ ts: rthClose, equity: lastEq });
            if (now > rthClose + 1000) built.push({ ts: now, equity: lastEq });
          } else if (now > openTs) {
            built.push({ ts: now, equity: lastEq });
          }
          return { points: built, delta: dayPnl, axisStart: windowStart, axisEnd: now };
        }

        return {
          points: pts,
          delta: lastEq - pts[0].equity,
          axisStart: windowStart,
          axisEnd: now,
        };
      }

      function buildPerformancePath(range, rawPoints, liveEq, dayPnl, sinceTs) {
        if (range === "1D") {
          if (dayPnl == null) {
            const first = rawPoints[0]?.equity;
            const last = rawPoints.length ? rawPoints[rawPoints.length - 1].equity : null;
            const delta = (Number.isFinite(last) && Number.isFinite(first)) ? last - first : null;
            return { points: rawPoints, delta, axisStart: null, axisEnd: null };
          }
          const built = buildDayPath(rawPoints, liveEq, dayPnl);
          return { ...built, axisStart: null, axisEnd: null };
        }
        if (range === "ALL") {
          const first = rawPoints[0]?.equity;
          const last = Number.isFinite(liveEq)
            ? liveEq
            : (rawPoints.length ? rawPoints[rawPoints.length - 1].equity : null);
          let pts = rawPoints;
          if (pts.length && Number.isFinite(last)) {
            const now = Date.now();
            pts = [...pts];
            if (pts[pts.length - 1].ts < now - 500) pts.push({ ts: now, equity: last });
            else pts[pts.length - 1] = { ts: now, equity: last };
          }
          const span = pts.length
            ? Math.max(...pts.map((p) => p.equity)) - Math.min(...pts.map((p) => p.equity))
            : 0;
          if (span < 1 && dayPnl != null && Math.abs(dayPnl) >= 0.005) {
            return buildRangePath(pts, liveEq, dayPnl, pts[0]?.ts || (Date.now() - 86400000));
          }
          const delta = (Number.isFinite(last) && Number.isFinite(first)) ? last - first : null;
          return { points: pts, delta, axisStart: pts[0]?.ts || null, axisEnd: Date.now() };
        }
        return buildRangePath(rawPoints, liveEq, dayPnl, sinceTs);
      }

      function accountKey(a) {
        return String(a?.broker_account_id || a?.user_id || a?.account_id || a?.label || "");
      }

      function firstMirrorOnTsForCurve(a) {
        const rows = (a?.markers || []).filter((m) => m?.on && Number(m.ts) > 0);
        return rows.length ? Math.min(...rows.map((m) => Number(m.ts))) : null;
      }

      function sinceMirrorValueChange(a) {
        const direct = a?.since_mirror_gain == null ? NaN : Number(a.since_mirror_gain);
        if (Number.isFinite(direct)) return direct;
        const start = firstMirrorOnTsForCurve(a);
        const current = Number(a?.equity);
        const pts = [...(a?.points || [])].sort((x, y) => x.ts - y.ts);
        if (!start || !Number.isFinite(current) || !pts.length) return null;
        let base = null;
        for (const p of pts) {
          if (p.ts <= start) base = p.equity;
          else {
            if (base == null) base = p.equity;
            break;
          }
        }
        return Number.isFinite(base) ? current - base : null;
      }

      function accountPerformance(a, liveAccounts, range, sinceTs) {
        const rawPoints = combineForwardFill([a], sinceTs);
        const dayPnl = dayPnlForSelected([a], liveAccounts);
        const liveEq = Number(a.equity);
        const built = buildPerformancePath(range, rawPoints, liveEq, dayPnl, sinceTs);
        const current = built.points.length
          ? Number(built.points[built.points.length - 1].equity)
          : (Number.isFinite(liveEq) ? liveEq : null);
        // One equity point is a current value, not a performance period.
        // Only 1D broker day_pnl can establish a change without two history
        // samples; never turn missing history into a persuasive "$0.00".
        const hasWindowHistory = rawPoints.length >= 2
          && Number(rawPoints[rawPoints.length - 1].ts) > Number(rawPoints[0].ts);
        const hasPeriod = hasWindowHistory || (range === "1D" && dayPnl != null);
        const delta = hasPeriod && Number.isFinite(Number(built.delta)) ? Number(built.delta) : null;
        const base = Number.isFinite(current) && Number.isFinite(delta) ? current - delta : null;
        const pct = Number.isFinite(delta) && Number.isFinite(base) && base
          ? (delta / base) * 100
          : null;
        return {
          account: a,
          current,
          delta,
          pct,
          dayPnl,
          sinceMirror: sinceMirrorValueChange(a),
          firstMirrorOn: firstMirrorOnTsForCurve(a),
        };
      }

      function AccountPerformanceRow({ accounts, liveAccounts, range, sinceTs, focus, onFocus, onRange }) {
        const rows = useMemo(() => accounts.map((a) =>
          accountPerformance(a, liveAccounts, range, sinceTs)
        ), [accounts, liveAccounts, range, sinceTs]);

        const groupStats = useMemo(() => {
          const calc = (on) => {
            const group = rows.filter((r) => r.account.mirror_enabled === on && Number.isFinite(r.delta));
            if (!group.length) return null;
            const delta = group.reduce((s, r) => s + r.delta, 0);
            const base = group.reduce((s, r) =>
              s + (Number.isFinite(r.current) ? r.current - r.delta : 0), 0);
            return { delta, pct: base ? (delta / base) * 100 : null, n: group.length };
          };
          return { on: calc(true), off: calc(false) };
        }, [rows]);

        const rangeCopy = range === "1D" ? "broker day P&L" : `${range} account value change`;
        const groupChip = (label, stat, cls) => (
          <span className={`bc-pill ${cls}`}>
            {label} · {stat ? fmtSigned(stat.delta) : "no period data"}
            {stat && Number.isFinite(stat.pct) ? ` (${stat.pct >= 0 ? "+" : ""}${stat.pct.toFixed(2)}%)` : ""}
          </span>
        );

        return (
          <section className="acct-perf fade-in" aria-label="Account performance">
            <div className="acct-perf-head">
              <div>
                <div className="tt-sec-title">Account performance</div>
                <div className="tt-sec-h" style={{ fontSize: 16 }}>Every connected account · {rangeCopy}</div>
                <div className="dim" style={{ fontSize: 10, marginTop: 3 }}>
                  1D uses broker P&amp;L. Longer ranges show observed account-value change; cash transfers can affect those periods.
                </div>
              </div>
              <div className="acct-perf-actions">
                <div className="eq-range" aria-label="Account performance timeframe">
                  {EQ_RANGES.map((r) => (
                    <button key={r.id} type="button" className={range === r.id ? "on" : ""}
                      onClick={() => onRange(r.id)}>{r.id}</button>
                  ))}
                </div>
                <div className="acct-compare">
                  {groupChip("Mirror on", groupStats.on, "p-ok")}
                  {groupChip("Not mirrored", groupStats.off, "p-off")}
                </div>
              </div>
            </div>
            <div className="acct-perf-grid">
              {rows.map((r) => {
                const a = r.account;
                const key = accountKey(a);
                const active = focus === key || focus === a.user_id;
                const on = a.mirror_enabled === true;
                const deltaClass = Number.isFinite(r.delta) ? (r.delta >= 0 ? "up" : "dn") : "dim";
                return (
                  <button key={key} type="button"
                    className={`acct-perf-card ${on ? "on" : "off"} ${active ? "active" : ""}`}
                    onClick={() => onFocus(key)}
                    title={`Show ${a.label || key} value history`}>
                    <div className="acct-perf-top">
                      <span className="acct-perf-name">{a.label || key}</span>
                      <span className={`bc-pill ${on ? "p-ok" : "p-off"}`}>{on ? "MIRROR ON" : "NOT MIRRORED"}</span>
                    </div>
                    <div className="acct-perf-value">{Number.isFinite(r.current) ? fmtUsd(r.current, { compact: true }) : "—"}</div>
                    <div className={`acct-perf-change ${deltaClass}`}>
                      {Number.isFinite(r.delta) ? fmtSigned(r.delta) : "—"}
                      {Number.isFinite(r.pct) ? ` (${r.pct >= 0 ? "+" : ""}${r.pct.toFixed(2)}%)` : ""}
                    </div>
                    <div className="acct-perf-sub">{rangeCopy}</div>
                    <div className="acct-perf-since">
                      <span>{r.firstMirrorOn ? "Since first mirror on" : "Model-managed history"}</span>
                      <b className={Number.isFinite(r.sinceMirror) ? (r.sinceMirror >= 0 ? "up" : "dn") : "dim"}>
                        {r.firstMirrorOn && Number.isFinite(r.sinceMirror) ? fmtSigned(r.sinceMirror) : "Not started"}
                      </b>
                    </div>
                  </button>
                );
              })}
            </div>
          </section>
        );
      }

      function EquityCurve({ liveAccounts }) {
        const [data, setData] = useState(null);
        const [range, setRange] = useState("1D");
        const [focus, setFocus] = useState("mirrored");
        const [tick, setTick] = useState(0);

        useEffect(() => {
          let alive = true;
          const load = () => {
            apiGet("/timed/broker/equity-curve").then((j) => {
              if (alive && j?.ok) setData(j);
              else if (alive) setData({ ok: false, accounts: [] });
            }).catch(() => { if (alive) setData({ ok: false, accounts: [] }); });
          };
          load();
          // Live refresh while the page is open — denser samples land as
          // the reconciler / bridge GET stamps 5-min buckets.
          const id = setInterval(() => { load(); setTick((n) => n + 1); }, 60000);
          return () => { alive = false; clearInterval(id); };
        }, []);

        const accounts = useMemo(() => {
          const rows = data?.accounts || [];
          const now = Date.now();
          const claimed = new Set();
          const merged = rows.map((a) => {
            const live = matchLiveAccount(a, liveAccounts);
            if (live) claimed.add(live.account_id || live.broker_account_id || live.label);
            const eq = Number(live?.equity_usd);
            const pts = [...(a.points || [])].sort((x, y) => x.ts - y.ts);
            if (Number.isFinite(eq)) {
              const last = pts[pts.length - 1];
              if (!last) pts.push({ ts: now, equity: eq });
              else if (now - last.ts > 20_000 || Math.abs(last.equity - eq) > 0.005) {
                pts.push({ ts: now, equity: eq });
              } else {
                pts[pts.length - 1] = { ts: now, equity: eq };
              }
            }
            return {
              ...a,
              points: pts,
              equity: Number.isFinite(eq) ? eq : a.equity,
              mirror_enabled: live ? live.mirror_enabled === true : a.mirror_enabled === true,
              label: live?.label || a.label,
            };
          });
          // Equity history is snapshot-backed. A newly connected account may
          // not have its first history row yet; add it from the live positions
          // payload so every connected account still gets a card + filter.
          for (const live of liveAccounts || []) {
            const liveKey = live.account_id || live.broker_account_id || live.label;
            if (!liveKey || claimed.has(liveKey)) continue;
            const eq = Number(live.equity_usd);
            const markers = (live.mirror_events || [])
              .filter((e) => e && Number(e.ts) > 0)
              .map((e) => ({ ts: Number(e.ts), on: e.on === true }))
              .sort((a, b) => a.ts - b.ts);
            merged.push({
              broker_account_id: live.broker_account_id || live.webull_account_id || live.account_id,
              user_id: live.account_id || null,
              label: live.label || live.account_id,
              broker: live.broker || null,
              mirror_enabled: live.mirror_enabled === true,
              points: Number.isFinite(eq) ? [{ ts: Number(live.positions_as_of) || now, equity: eq }] : [],
              markers,
              equity: Number.isFinite(eq) ? eq : null,
              since_mirror_gain: null,
            });
          }
          return merged.sort((a, b) => {
            const onDiff = Number(b.mirror_enabled === true) - Number(a.mirror_enabled === true);
            if (onDiff) return onDiff;
            const histDiff = Number(!!firstMirrorOnTsForCurve(b)) - Number(!!firstMirrorOnTsForCurve(a));
            if (histDiff) return histDiff;
            return String(a.label || accountKey(a)).localeCompare(String(b.label || accountKey(b)));
          });
        }, [data, liveAccounts, tick]);

        const selected = useMemo(() => {
          if (focus === "all") return accounts;
          if (focus === "mirrored") return accounts.filter((a) => a.mirror_enabled === true);
          return accounts.filter((a) => accountKey(a) === focus || a.user_id === focus);
        }, [accounts, focus]);

        const sinceTs = rangeStartMs(range);
        const rawPoints = useMemo(() => combineForwardFill(selected, sinceTs), [selected, sinceTs]);
        const sessionDayPnl = useMemo(() => dayPnlForSelected(selected, liveAccounts), [selected, liveAccounts]);
        const liveEqSum = useMemo(() => {
          let sum = 0, n = 0;
          for (const a of selected) {
            const eq = Number(a.equity);
            if (Number.isFinite(eq)) { sum += eq; n++; }
          }
          return n ? sum : null;
        }, [selected]);
        const dayBuilt = useMemo(() =>
          buildPerformancePath(range, rawPoints, liveEqSum, sessionDayPnl, sinceTs)
        , [range, rawPoints, liveEqSum, sessionDayPnl, sinceTs]);
        const points = dayBuilt.points;
        const markers = useMemo(() => {
          const rows = [];
          for (const a of selected) {
            for (const m of a.markers || []) {
              if (sinceTs && m.ts < sinceTs) continue;
              rows.push({ ...m, label: a.label || a.broker_account_id });
            }
          }
          return rows.sort((a, b) => a.ts - b.ts);
        }, [selected, sinceTs]);

        const lastEq = points.length ? points[points.length - 1].equity : null;
        const firstEq = points.length ? points[0].equity : null;
        const delta = dayBuilt.delta != null
          ? dayBuilt.delta
          : ((Number.isFinite(lastEq) && Number.isFinite(firstEq)) ? lastEq - firstEq : null);
        const deltaBasis = Number.isFinite(firstEq) ? firstEq : (Number.isFinite(lastEq) && Number.isFinite(delta) ? lastEq - delta : null);
        const deltaPct = (Number.isFinite(delta) && Number.isFinite(deltaBasis) && deltaBasis) ? (delta / deltaBasis) * 100 : null;
        const up = (delta == null) ? true : delta >= 0;
        const stroke = up ? "var(--tt-success, #34d399)" : "var(--tt-danger, #ef4444)";
        const fill = up ? "rgba(52,211,153,0.14)" : "rgba(239,68,68,0.12)";
        const rangeLabel = range === "1D" ? "today" : (range === "ALL" ? "all time" : range);

        const W = 640, H = 200, padL = 6, padR = 6, padT = 18, padB = 22;
        let path = "", area = "";
        let liveX = null, liveY = null;
        const marks = [];
        const axisStartLabel = range === "1D"
          ? (points[0] ? fmtTime(points[0].ts) : "")
          : fmtDay(dayBuilt.axisStart || points[0]?.ts || Date.now());
        const axisEndLabel = range === "1D" ? "Now" : "Now";
        const focusedAccount = accounts.find((a) => accountKey(a) === focus || a.user_id === focus);
        const chartTitle = focus === "mirrored"
          ? "Mirror-on accounts"
          : (focus === "all" ? "All connected accounts" : (focusedAccount?.label || "Account"));
        if (points.length >= 1) {
          // Multi-day ranges always span the full selected window so 1W
          // never collapses both labels onto today.
          const t0 = (range !== "1D" && dayBuilt.axisStart) ? dayBuilt.axisStart : points[0].ts;
          const t1 = (range !== "1D" && dayBuilt.axisEnd)
            ? dayBuilt.axisEnd
            : Math.max(points[points.length - 1].ts, Date.now());
          const eqs = points.map((p) => p.equity);
          let lo = Math.min(...eqs), hi = Math.max(...eqs);
          const pad = Math.max(Math.abs(lo) * 0.004, Math.abs(delta || 0) * 0.15, 1);
          if (hi === lo) { lo -= pad; hi += pad; }
          else {
            const span = hi - lo;
            lo -= span * 0.08;
            hi += span * 0.08;
          }
          const xOf = (ts) => padL + ((ts - t0) / Math.max(1, t1 - t0)) * (W - padL - padR);
          const yOf = (eq) => padT + (1 - (eq - lo) / (hi - lo)) * (H - padT - padB);
          const plot = [...points];
          if (plot.length && plot[plot.length - 1].ts < t1 - 1000) {
            plot.push({ ts: t1, equity: plot[plot.length - 1].equity });
          }
          path = plot.map((p, i) => `${i ? "L" : "M"}${xOf(p.ts).toFixed(1)},${yOf(p.equity).toFixed(1)}`).join(" ");
          const lastX = xOf(plot[plot.length - 1].ts);
          const firstX = xOf(plot[0].ts);
          area = `${path} L${lastX.toFixed(1)},${H - padB} L${firstX.toFixed(1)},${H - padB} Z`;
          liveX = lastX;
          liveY = yOf(plot[plot.length - 1].equity);
          for (const m of markers) {
            if (m.ts < t0 || m.ts > t1) continue;
            marks.push({ x: xOf(m.ts), on: m.on, label: m.label });
          }
        }

        return (
          <>
          {accounts.length > 0 && (
            <AccountPerformanceRow
              accounts={accounts}
              liveAccounts={liveAccounts}
              range={range}
              sinceTs={sinceTs}
              focus={focus}
              onFocus={setFocus}
              onRange={setRange}
            />
          )}
          <section className="tt-card tt-card-pad" style={{ marginBottom: 18 }}>
            <div className="sec-head">
              <div>
                <div className="tt-sec-title">Portfolio growth</div>
                <div className="tt-sec-h" style={{ fontSize: 18 }}>
                  {chartTitle} · {range === "1D" ? "day P&L" : "account value history"}
                </div>
              </div>
            </div>
            <div className="eq-acct">
              <button type="button" className={`bc-pill ${focus === "mirrored" ? "p-mint" : "p-off"}`} onClick={() => setFocus("mirrored")} style={{ cursor: "pointer", border: "none" }}>Mirror-on group</button>
              <button type="button" className={`bc-pill ${focus === "all" ? "p-mint" : "p-off"}`} onClick={() => setFocus("all")} style={{ cursor: "pointer", border: "none" }}>All accounts</button>
              {accounts.map((a) => (
                <button type="button" key={accountKey(a)} className={`bc-pill ${(focus === accountKey(a) || focus === a.user_id) ? "p-mint" : "p-off"}`}
                  onClick={() => setFocus(accountKey(a))} style={{ cursor: "pointer", border: "none" }}>
                  {a.label || accountKey(a)} · {a.mirror_enabled ? "ON" : "OFF"}
                </button>
              ))}
            </div>
            {data === null && <div className="skel" style={{ height: 220, marginTop: 8 }} />}
            {data !== null && points.length === 0 && (
              <div className="dim" style={{ fontSize: 13, padding: "18px 0" }}>
                Growth history starts as the reconciler snapshots equity every few minutes. The first points land on the next cycle; mirror on/off markers still plot once recorded.
              </div>
            )}
            {points.length > 0 && (
              <div className="fade-in">
                <div style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap", margin: "4px 0 2px" }}>
                  <div className="k-val mono" style={{ fontSize: 26, fontWeight: 800 }}>{fmtUsd(lastEq, { compact: true })}</div>
                  {delta != null && (
                    <div className={`mono ${up ? "up" : "dn"}`} style={{ fontSize: 14, fontWeight: 700 }}>
                      {fmtSigned(delta)}{deltaPct != null ? ` (${deltaPct >= 0 ? "+" : ""}${deltaPct.toFixed(2)}%)` : ""} {rangeLabel}
                    </div>
                  )}
                </div>
                {range === "1D" && (
                  <div className="dim" style={{ fontSize: 12, marginBottom: 6 }}>
                    {sessionDayPnl != null
                      ? "Day change matches Today's P&L (prior close → live equity). Intraday samples densify as the reconciler runs."
                      : "Waiting on broker day marks to anchor prior close."}
                  </div>
                )}
                {range !== "1D" && sessionDayPnl != null
                  && Math.abs((delta || 0) - sessionDayPnl) < 0.02
                  && Math.abs(sessionDayPnl) >= 0.005 && (
                  <div className="dim" style={{ fontSize: 12, marginBottom: 6 }}>
                    Equity samples were flat across this window — showing the session move from Today's P&L until the reconciler builds a denser history.
                  </div>
                )}
                <svg className="eq-chart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" role="img" aria-label="Portfolio equity curve">
                  {area && <path className="eq-area" d={area} fill={fill} />}
                  {marks.map((m, i) => (
                    <g key={i}>
                      <line x1={m.x} x2={m.x} y1={padT} y2={H - padB} className={m.on ? "eq-mark-on" : "eq-mark-off"}
                        strokeWidth="1.25" strokeDasharray="3 3" />
                      <text x={m.x + 3} y={padT - 4} fill={m.on ? "var(--tt-success)" : "#a3b5ad"} fontSize="9" fontWeight="700">
                        {m.on ? "ON" : "OFF"}
                      </text>
                    </g>
                  ))}
                  {path && (
                    <path className="eq-line" d={path} fill="none" stroke={stroke} strokeWidth="2.4"
                      strokeDasharray="1200" style={{ strokeDashoffset: 0 }} />
                  )}
                  {liveX != null && liveY != null && (
                    <g className="eq-live">
                      <circle cx={liveX} cy={liveY} r="5.5" fill={stroke} opacity="0.25" />
                      <circle cx={liveX} cy={liveY} r="3" fill={stroke} />
                    </g>
                  )}
                  {points.length > 0 && (
                    <text x={padL} y={H - 6} fill="#a3b5ad" fontSize="10">
                      {axisStartLabel}
                    </text>
                  )}
                  {points.length > 0 && (
                    <text x={W - padR} y={H - 6} fill="#a3b5ad" fontSize="10" textAnchor="end">
                      {axisEndLabel}
                    </text>
                  )}
                </svg>
                {range === "1D" && points.length <= 2 && (
                  <div className="dim" style={{ fontSize: 11, marginTop: 4 }}>
                    Building the intraday curve — samples land every ~5 minutes while the mirror reconciler runs.
                  </div>
                )}
                {marks.length > 0 && range !== "1D" && (
                  <div className="dim" style={{ fontSize: 11, marginTop: 4 }}>
                    Vertical lines mark each mirror on / mirror off for the selected accounts.
                  </div>
                )}
              </div>
            )}
          </section>
          </>
        );
      }

      /* ══ App ═══════════════════════════════════════════════════════ */
      function BrokerConnectionsApp({ user }) {
        const isAdmin = user?.role === "admin" || user?.tier === "admin" || window._ttIsAdmin;
        const provisioned = user?.broker_connections_enabled === true || isAdmin;
        const [accounts, setAccounts] = useState(null);
        const [err, setErr] = useState(null);
        const [busy, setBusy] = useState(false);
        const [posData, setPosData] = useState(null);
        const [dayData, setDayData] = useState(null);
        const [railTicker, setRailTicker] = useState(null);
        const [railInitialTab, setRailInitialTab] = useState(null);
        const [RailOverlay, setRailOverlay] = useState(() => window.TimedRightRail?.Overlay || null);

        const refresh = useCallback(async () => {
          if (!provisioned) return;
          try {
            const json = await apiGet("/timed/broker/accounts");
            if (json?.ok) { setAccounts(json.accounts || []); setErr(null); }
            else { setAccounts([]); setErr(json?.error || "Request failed"); }
          } catch (e) { setAccounts([]); setErr(String(e?.message || e)); }
        }, [provisioned]);

        useEffect(() => { refresh(); }, [refresh]);

        // Same 72h window as the timeline so "Model actions" can fall back
        // to the prior session when today's NY book is still empty.
        useEffect(() => {
          if (!provisioned) return;
          let alive = true;
          apiGet("/timed/broker/day-actions?hours=72").then((j) => { if (alive && j?.ok) setDayData(j); }).catch(() => {});
          return () => { alive = false; };
        }, [provisioned, accounts]);

        const bootTimedRightRail = useCallback(() => {
          const boot = typeof window.ensureTimedRightRail === "function"
            ? window.ensureTimedRightRail()
            : Promise.resolve();
          return boot.then(() => {
            if (window.TimedRightRail?.Overlay) {
              setRailOverlay(() => window.TimedRightRail.Overlay);
            }
          });
        }, []);

        useEffect(() => {
          if (RailOverlay || !provisioned) return;
          let cancelled = false;
          const prefetch = () => { if (!cancelled) bootTimedRightRail().catch(() => {}); };
          if (typeof requestIdleCallback === "function") {
            const id = requestIdleCallback(prefetch, { timeout: 6000 });
            return () => { cancelled = true; cancelIdleCallback(id); };
          }
          const t = setTimeout(prefetch, 2500);
          return () => { cancelled = true; clearTimeout(t); };
        }, [RailOverlay, provisioned, bootTimedRightRail]);

        const onSelectTicker = useCallback((sym, initialTab = null) => {
          if (!sym) return;
          const ticker = String(sym).toUpperCase();
          const tab = initialTab ? String(initialTab).toUpperCase() : null;
          const open = () => {
            if (typeof window.ttOpenTickerInRail === "function") {
              window.ttOpenTickerInRail({
                ticker,
                initialRailTab: tab,
                source: "broker-connections",
              });
              return;
            }
            setRailTicker(ticker);
            setRailInitialTab(tab);
          };
          bootTimedRightRail().then(open).catch(open);
        }, [bootTimedRightRail]);

        const applyRailOpen = useCallback((detail) => {
          const p = typeof window.ttConsumeRailOpenForReact === "function"
            ? window.ttConsumeRailOpenForReact(detail)
            : null;
          const t = p?.ticker || String(detail?.ticker || "").toUpperCase();
          if (!t) return;
          setRailTicker(t);
          setRailInitialTab(p?.initialRailTab || detail?.initialRailTab || null);
        }, []);

        const onCloseRail = useCallback(() => {
          setRailTicker(null);
          setRailInitialTab(null);
          try { window.ttClearRailUrlParams?.(); } catch (_) {}
        }, []);

        useEffect(() => {
          if (!RailOverlay) return;
          const handler = (ev) => {
            applyRailOpen(ev?.detail);
            try {
              if (typeof window.ttGlobalSearchMarkHandled === "function") {
                window.ttGlobalSearchMarkHandled(ev?.detail?.ticker);
              }
            } catch (_) {}
          };
          window.addEventListener("tt-open-ticker", handler);
          if (typeof window.ttApplyPendingRailDeepLink === "function") {
            window.ttApplyPendingRailDeepLink();
          }
          return () => window.removeEventListener("tt-open-ticker", handler);
        }, [RailOverlay, applyRailOpen]);

        if (!provisioned) {
          return (
            <main>
              <div className="tt-status" style={{ marginBottom: 18 }}>
                <div className="label">Self-service mirror</div>
                <div className="greeting">Broker Connections</div>
              </div>
              <div className="tt-card tt-card-pad">
                <div style={{ fontWeight: 800, marginBottom: 6 }}>Not enabled on this account</div>
                <p className="dim" style={{ fontSize: 13, margin: 0, lineHeight: 1.6 }}>
                  Broker Connections is provisioned per account by the Timed Trading team.
                  Contact support to request access.
                </p>
              </div>
            </main>
          );
        }

        // Mirror-on accounts lead; then other webull accounts; then non-webull.
        const _sortMirrorFirst = (a, b) => {
          const ea = a.broker_integration_enabled === true ? 1 : 0;
          const eb = b.broker_integration_enabled === true ? 1 : 0;
          if (ea !== eb) return eb - ea;
          const la = a.webull_account_label || a.webull_account_class || a.user_id || "";
          const lb = b.webull_account_label || b.webull_account_class || b.user_id || "";
          return String(la).localeCompare(String(lb));
        };
        const webullAccounts = (accounts || []).filter((a) => (a.broker || "") === "webull").slice().sort(_sortMirrorFirst);
        const otherAccounts = (accounts || []).filter((a) => (a.broker || "") !== "webull").slice().sort(_sortMirrorFirst);
        const hasAny = webullAccounts.length > 0 || otherAccounts.length > 0;
        const anyEnabled = (accounts || []).some((a) => a.broker_integration_enabled === true);
        const marketOpen = PU.isNyRegularMarketOpen ? PU.isNyRegularMarketOpen() : null;

        // KPI totals:
        //  - Mirrored value / Model P&L = model-managed sleeves only
        //  - Today's P&L = overall day change on mirror-on accounts
        //    (includes user-owned holdings so the strip can segregate)
        const totals = useMemo(() => {
          const accs = posData?.accounts || [];
          let value = 0, day = 0, model = 0, managedQty = 0, dayQty = 0;
          let hasDay = false, hasModel = false;
          for (const a of accs) {
            const mirrorOn = a.mirror_enabled === true;
            let acctManagedVal = 0;
            let acctDayFromItems = 0;
            let acctDayItems = 0;
            for (const it of a.items || []) {
              const qty = Number(it.broker_qty) || 0;
              if (!(qty > 0.0001)) continue;
              // Overall day change: every held lot on a mirror-on account.
              if (mirrorOn && Number.isFinite(Number(it.day_pnl))) {
                day += Number(it.day_pnl);
                hasDay = true;
                dayQty += qty;
                acctDayFromItems += Number(it.day_pnl);
                acctDayItems += qty;
              }
              if (!it.managed) continue;
              managedQty += qty;
              const px = Number(it.price) > 0 ? Number(it.price)
                : (Number(it.last_price) > 0 ? Number(it.last_price)
                  : (Number(it.avg_cost) > 0 ? Number(it.avg_cost) : 0));
              const mv = Number(it.market_value) > 0 ? Number(it.market_value) : (px > 0 ? px * qty : 0);
              acctManagedVal += mv;
              if (Number.isFinite(Number(it.unrealized_pnl))) {
                model += Number(it.unrealized_pnl);
                hasModel = true;
              }
            }
            if (acctManagedVal > 0) value += acctManagedVal;
            // Account-level day_pnl when per-item day marks were missing.
            if (mirrorOn && !acctDayItems && Number.isFinite(a.summary?.day_pnl) && a.summary.day_pnl !== null) {
              day += a.summary.day_pnl;
              hasDay = true;
              dayQty += 1;
            }
          }
          const sessionOpen = PU.isNyRegularMarketOpen ? PU.isNyRegularMarketOpen() : false;
          return {
            value,
            day,
            model,
            hasDay: hasDay && dayQty > 0,
            dayLabel: sessionOpen ? "all holdings on mirror-on accounts" : "prior session · all holdings",
            hasModel: hasModel && managedQty > 0,
            hasValue: value > 0,
            loaded: !!posData,
          };
        }, [posData]);
        // Model Actions: prefer today's ET session; else newest day in the
        // 72h window (matches the timeline below so the KPI never reads 0
        // while the feed shows fills).
        const modelActionsTile = useMemo(() => {
          if (!dayData) return { count: null, sub: "loading…" };
          const nyDate = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
          const bucket = new Map();
          for (const a of dayData.actions || []) {
            const key = nyDateKey(Number(a.ts) || 0);
            if (!bucket.has(key)) bucket.set(key, []);
            bucket.get(key).push(a);
          }
          const summarize = (rows, prior) => {
            const mirrored = rows.filter((a) => a.mirror === "mirrored").length;
            const held = rows.filter((a) => a.mirror === "rejected" || a.mirror === "skipped").length;
            return {
              count: rows.length,
              sub: prior
                ? `${mirrored} mirrored · ${held} held back · prior session`
                : `${mirrored} mirrored · ${held} held back`,
            };
          };
          const today = bucket.get(nyDate) || [];
          if (today.length) return summarize(today, false);
          const keys = [...bucket.keys()].sort((a, b) => String(b).localeCompare(String(a)));
          const prior = keys.length ? bucket.get(keys[0]) : [];
          if (!prior.length) {
            const s = dayData.summary;
            if (s && Number(s.actions) > 0) {
              return {
                count: Number(s.actions),
                sub: `${Number(s.mirrored) || 0} mirrored · ${(Number(s.rejected) || 0) + (Number(s.skipped) || 0)} held back`,
              };
            }
            return { count: 0, sub: "0 mirrored · 0 held back" };
          }
          return summarize(prior, true);
        }, [dayData]);

        const railTickerObj = railTicker ? { ticker: railTicker } : null;

        return (
          <>
          <main>
            <div className="tt-status" style={{ marginBottom: 16, display: "flex", alignItems: "flex-end", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
              <div>
                <div className="label">Self-service mirror</div>
                <div className="greeting">Broker Connections</div>
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {marketOpen != null && (
                  <span className={`bc-pill ${marketOpen ? "p-ok" : "p-off"}`}><span className="dot" />{marketOpen ? "MARKET OPEN" : "MARKET CLOSED"}</span>
                )}
                {hasAny && <span className={`bc-pill ${anyEnabled ? "p-mint" : "p-off"}`}>{anyEnabled ? "MIRROR ACTIVE" : "MIRROR PAUSED"}</span>}
              </div>
            </div>

            {err && (
              <div className="tt-card tt-card-pad" style={{ borderColor: "rgba(245,158,11,0.35)", marginBottom: 14 }}>
                <div style={{ color: "var(--tt-warning)", fontSize: 13 }}>Status: {err}</div>
              </div>
            )}

            {accounts === null && (
              <div>
                <div className="kpi-strip">{[0, 1, 2, 3].map((i) => <div key={i} className="skel" style={{ height: 74 }} />)}</div>
                <div className="skel" style={{ height: 180, marginBottom: 16 }} />
              </div>
            )}

            {accounts !== null && hasAny && (
              <div className="kpi-strip fade-in">
                <div className="kpi">
                  <div className="k-lbl">Mirrored value</div>
                  <div className="k-val">
                    {!totals.loaded ? "…" : (totals.hasValue ? fmtUsd(totals.value, { compact: true }) : "—")}
                  </div>
                  <div className="k-sub">
                    {webullAccounts.length + otherAccounts.length} account{webullAccounts.length + otherAccounts.length === 1 ? "" : "s"}
                  </div>
                </div>
                <div className="kpi">
                  <div className="k-lbl">Today's P&L</div>
                  <div className={`k-val ${totals.hasDay ? (totals.day >= 0 ? "up" : "dn") : ""}`}>
                    {!totals.loaded ? "…" : (totals.hasDay ? fmtSigned(totals.day) : "—")}
                  </div>
                  <div className="k-sub">{totals.hasDay ? totals.dayLabel : "session not started"}</div>
                </div>
                <div className="kpi">
                  <div className="k-lbl">Model P&L</div>
                  <div className={`k-val ${totals.hasModel ? (totals.model >= 0 ? "up" : "dn") : ""}`}>
                    {!totals.loaded ? "…" : (totals.hasModel ? fmtSigned(totals.model) : "—")}
                  </div>
                  <div className="k-sub">unrealized · model-managed sleeves only</div>
                </div>
                <div className="kpi">
                  <div className="k-lbl">Model actions</div>
                  <div className="k-val">{modelActionsTile.count == null ? "…" : modelActionsTile.count}</div>
                  <div className="k-sub">{modelActionsTile.sub}</div>
                </div>
              </div>
            )}

            {accounts !== null && hasAny && <EquityCurve liveAccounts={posData?.accounts || []} />}
            {accounts !== null && hasAny && <DayActions refreshKey={accounts} />}
            {accounts !== null && hasAny && (
              <PositionsSection refreshKey={accounts} onData={setPosData} onSelectTicker={onSelectTicker} />
            )}

            {accounts !== null && hasAny && (
              <section style={{ marginBottom: 18 }}>
                <div className="sec-head" style={{ marginBottom: 10 }}>
                  <div>
                    <div className="tt-sec-title">Accounts</div>
                    <div className="tt-sec-h" style={{ fontSize: 18 }}>Mirror settings</div>
                  </div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {anyEnabled && (
                      <button className="bc-btn bc-btn-sm" disabled={busy}
                        style={{ borderColor: "rgba(245,158,11,0.4)", color: "var(--tt-warning)" }}
                        title="Kill switch — pause mirroring on every account at once"
                        onClick={async () => {
                          if (!confirm("Pause ALL mirroring? Every account stops receiving model orders immediately. Accounts stay connected and can be re-enabled individually.")) return;
                          setBusy(true);
                          try { await apiPost("/timed/broker/pause-all", {}); refresh(); }
                          finally { setBusy(false); }
                        }}>Pause all mirroring</button>
                    )}
                    {webullAccounts.length > 0 && (
                      <button className="bc-btn bc-btn-sm bc-btn-danger" disabled={busy}
                        onClick={async () => {
                          if (!confirm("Disconnect Webull? Mirroring stops for every account under this login and the stored keys are removed.")) return;
                          setBusy(true);
                          try { await apiPost("/timed/broker/webull/disconnect", {}); refresh(); }
                          finally { setBusy(false); }
                        }}>Disconnect Webull</button>
                    )}
                  </div>
                </div>
                {webullAccounts.map((acct) => <AccountCard key={acct.user_id} acct={acct} onChanged={refresh} />)}
                {otherAccounts.map((acct) => <AccountCard key={acct.user_id} acct={acct} onChanged={refresh} />)}
              </section>
            )}

            {accounts !== null && !hasAny && (
              <section className="tt-card tt-card-pad" style={{ marginBottom: 18 }}>
                <div className="tt-sec-title">Get started</div>
                <div className="tt-sec-h" style={{ fontSize: 18, marginBottom: 6 }}>Connect Webull</div>
                <ConnectForm onConnected={refresh} />
              </section>
            )}

            {accounts !== null && hasAny && (
              <details className="tt-disclose">
                <summary>
                  <span className="tt-disclose-title">Rotate keys</span>
                  <span className="tt-disclose-sub">paste a regenerated Webull key pair — accounts and settings are preserved</span>
                  <span className="tt-disclose-caret">▼</span>
                </summary>
                <div className="tt-disclose-body">
                  <ConnectForm onConnected={refresh} compact />
                </div>
              </details>
            )}

            <p className="dim" style={{ fontSize: 11, marginTop: 20, lineHeight: 1.6 }}>
              Optional auto-mirror sends model BUY/TRIM/EXIT signals to connected brokerage accounts,
              sized per account with hard per-order and per-day limits. Order confirmations and
              mirror-sync notices are emailed to the account holder and the Timed Trading admin desk.
              Market data powered by Twelve Data.
            </p>
          </main>
          {RailOverlay && railTickerObj && (
            <RailOverlay
              ticker={railTickerObj}
              allLoadedData={null}
              initialRailTab={railInitialTab}
              onClose={onCloseRail}
            />
          )}
          </>
        );
      }

      const AuthGate = window.TimedAuthGate;
      const app = AuthGate
        ? React.createElement(AuthGate, { apiBase: API_BASE, requiredTier: "free" }, (user) => React.createElement(BrokerConnectionsApp, { user }))
        : React.createElement(BrokerConnectionsApp, { user: null });
      ReactDOM.createRoot(document.getElementById("root")).render(app);
    </script>
  </body>
</html>

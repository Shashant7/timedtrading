<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Broker Connections — Timed Trading</title>
    <meta name="description" content="Connect a brokerage account for optional auto-mirror execution." />
    <link rel="stylesheet" href="tt-tokens.css?v=20260610-verda4" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="auth-gate.js?v=20260811-broker-connections"></script>
    <script src="tt-bottom-nav.js?v=20260610-verda3" defer></script>
    <script src="investor-nav-badge.js?v=20260622a"></script>
    <script src="tt-nav-extras.js?v=20260610-verda3" defer></script>
    <style>
      :root {
        --bg: #0b0e11; --surface: rgba(255,255,255,0.025); --border: rgba(255,255,255,0.06);
        --text: #e5e7eb; --muted: #9ca3af; --faint: #6b7280;
        --up: #34d399; --warn: #fbbf24; --accent: #38bdf8; --down: #f87171;
      }
      body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; margin: 0; min-height: 100vh; }
      main { max-width: 960px; margin: 0 auto; padding: 24px 20px 96px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
      .pill-ok { background: rgba(52,211,153,0.12); color: var(--up); border: 1px solid rgba(52,211,153,0.3); }
      .pill-warn { background: rgba(251,191,36,0.12); color: var(--warn); border: 1px solid rgba(251,191,36,0.3); }
      .pill-off { background: rgba(255,255,255,0.05); color: var(--faint); border: 1px solid rgba(255,255,255,0.1); }
      .btn { padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--text); }
      .btn-primary { background: rgba(56,189,248,0.14); color: var(--accent); border-color: rgba(56,189,248,0.35); }
      .btn-danger { background: rgba(248,113,113,0.10); color: var(--down); border-color: rgba(248,113,113,0.3); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .input { width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); color: var(--text); font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
      .input:focus { outline: none; border-color: rgba(56,189,248,0.5); }
      .caps-input { width: 90px; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); color: var(--text); font-size: 12px; }
      h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px; }
      .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
      .lbl { display: block; font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: 0.05em; text-transform: uppercase; margin: 12px 0 5px; }
      .toggle { position: relative; width: 40px; height: 22px; border-radius: 999px; border: none; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
      .toggle .knob { position: absolute; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left 0.15s; }
      .msg-ok { color: var(--up); font-size: 12px; }
      .msg-err { color: var(--down); font-size: 12px; }
      ol.steps { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.7; }
      code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useCallback } = React;
      const h = React.createElement;
      const API_BASE = "";

      function AccountCard({ acct, onChanged }) {
        const [busy, setBusy] = useState(false);
        const [msg, setMsg] = useState(null);
        const caps = acct.user_caps || {};
        const [perOrder, setPerOrder] = useState(caps.max_per_order_usd ?? "");
        const [perDay, setPerDay] = useState(caps.max_orders_per_day ?? "");
        const enabled = !!acct.broker_integration_enabled;

        const call = async (path, body, okText) => {
          setBusy(true);
          setMsg(null);
          try {
            const res = await fetch(`${API_BASE}${path}`, {
              method: "POST", credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            const json = await res.json().catch(() => null);
            if (json?.ok) {
              setMsg({ ok: true, text: okText });
              onChanged();
            } else {
              setMsg({ ok: false, text: json?.error || "Request failed" });
            }
          } catch (e) {
            setMsg({ ok: false, text: String(e?.message || e) });
          } finally { setBusy(false); }
        };

        return h("div", { className: "card" },
          h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 } },
            h("div", null,
              h("div", { style: { fontWeight: 700, fontSize: 15 } },
                acct.webull_account_label || acct.webull_account_class || "Account"),
              h("div", { style: { fontSize: 11, color: "var(--faint)", marginTop: 3, fontFamily: "ui-monospace, Menlo, monospace" } },
                (acct.broker || "webull").toUpperCase(),
                acct.webull_account_id ? ` · ${acct.webull_account_id}` : ""),
            ),
            h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
              h("span", { className: `pill ${enabled ? "pill-ok" : "pill-off"}` }, enabled ? "MIRROR ON" : "MIRROR OFF"),
              h("button", {
                className: "toggle",
                disabled: busy,
                title: enabled ? "Pause mirroring for this account" : "Enable mirroring for this account",
                style: { background: enabled ? "rgba(52,211,153,0.55)" : "rgba(255,255,255,0.12)" },
                onClick: () => {
                  const next = !enabled;
                  const warn = next
                    ? "Enable live mirroring for this account? Model ENTRY/TRIM/EXIT signals will place real orders, sized to the account and capped by the limits below."
                    : "Pause mirroring for this account? No further orders will be placed.";
                  if (confirm(warn)) call("/timed/broker/account/enable", { account_id: acct.user_id, enable: next }, next ? "Mirroring enabled" : "Mirroring paused");
                },
              }, h("span", { className: "knob", style: { left: enabled ? 21 : 3 } })),
            ),
          ),
          h("div", { style: { display: "flex", alignItems: "flex-end", gap: 14, flexWrap: "wrap", marginTop: 14 } },
            h("div", null,
              h("div", { className: "lbl", style: { margin: "0 0 5px" } }, "Max $ / order"),
              h("input", { className: "caps-input", type: "number", min: 1, value: perOrder,
                onChange: (e) => setPerOrder(e.target.value) }),
            ),
            h("div", null,
              h("div", { className: "lbl", style: { margin: "0 0 5px" } }, "Max orders / day"),
              h("input", { className: "caps-input", type: "number", min: 0, value: perDay,
                onChange: (e) => setPerDay(e.target.value) }),
            ),
            h("button", {
              className: "btn", disabled: busy,
              onClick: () => {
                const body = { account_id: acct.user_id };
                if (perOrder !== "") body.max_per_order_usd = Number(perOrder);
                if (perDay !== "") body.max_orders_per_day = Number(perDay);
                call("/timed/broker/account/caps", body, "Limits saved");
              },
            }, "Save limits"),
            msg && h("span", { className: msg.ok ? "msg-ok" : "msg-err" }, msg.text),
          ),
        );
      }

      function ConnectForm({ onConnected }) {
        const [appKey, setAppKey] = useState("");
        const [appSecret, setAppSecret] = useState("");
        const [busy, setBusy] = useState(false);
        const [msg, setMsg] = useState(null);

        return h("div", { className: "card" },
          h("div", { style: { fontWeight: 700, fontSize: 15, marginBottom: 4 } }, "Connect Webull"),
          h("p", { style: { fontSize: 13, color: "var(--muted)", margin: "0 0 4px", lineHeight: 1.6 } },
            "Generate a personal API key pair in the Webull account that will mirror trades:"),
          h("ol", { className: "steps" },
            h("li", null, "Sign in at ", h("a", { href: "https://www.webull.com/open-api", target: "_blank", rel: "noopener", style: { color: "var(--accent)" } }, "webull.com/open-api"), " with the brokerage login."),
            h("li", null, "Open ", h("b", null, "API Keys Management"), " → ", h("b", null, "Generate Key"), ". Leave 2FA unchecked."),
            h("li", null, "Copy the ", h("b", null, "App Key"), " and ", h("b", null, "App Secret"), " (the secret is shown once) and paste both below."),
          ),
          h("div", { className: "lbl" }, "App Key"),
          h("input", { className: "input", value: appKey, autoComplete: "off", spellCheck: false,
            placeholder: "wb_app_key…", onChange: (e) => setAppKey(e.target.value) }),
          h("div", { className: "lbl" }, "App Secret"),
          h("input", { className: "input", value: appSecret, type: "password", autoComplete: "off",
            placeholder: "••••••••••••", onChange: (e) => setAppSecret(e.target.value) }),
          h("div", { style: { display: "flex", alignItems: "center", gap: 12, marginTop: 14 } },
            h("button", {
              className: "btn btn-primary",
              disabled: busy || !appKey.trim() || !appSecret.trim(),
              onClick: async () => {
                setBusy(true);
                setMsg(null);
                try {
                  const res = await fetch(`${API_BASE}/timed/broker/webull/connect`, {
                    method: "POST", credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ app_key: appKey.trim(), app_secret: appSecret.trim() }),
                  });
                  const json = await res.json().catch(() => null);
                  if (json?.ok) {
                    setMsg({ ok: true, text: `Connected — ${json.accounts_connected || 0} account(s) found` });
                    setAppKey(""); setAppSecret("");
                    onConnected();
                  } else {
                    setMsg({ ok: false, text: json?.note || json?.error || "Connection failed — check the key pair" });
                  }
                } catch (e) {
                  setMsg({ ok: false, text: String(e?.message || e) });
                } finally { setBusy(false); }
              },
            }, busy ? "Validating…" : "Connect"),
            msg && h("span", { className: msg.ok ? "msg-ok" : "msg-err" }, msg.text),
          ),
          h("p", { style: { fontSize: 11, color: "var(--faint)", margin: "12px 0 0", lineHeight: 1.6 } },
            "The key pair is validated against Webull before anything is stored, then encrypted at rest. ",
            "Keys never appear in the browser again after this step."),
        );
      }

      function BrokerConnectionsApp({ user }) {
        const isAdmin = user?.role === "admin" || user?.tier === "admin" || window._ttIsAdmin;
        const provisioned = user?.broker_connections_enabled === true || isAdmin;
        const [accounts, setAccounts] = useState(null);
        const [err, setErr] = useState(null);
        const [busy, setBusy] = useState(false);

        const refresh = useCallback(async () => {
          if (!provisioned) return;
          try {
            const res = await fetch(`${API_BASE}/timed/broker/accounts`, { credentials: "include" });
            const json = await res.json().catch(() => null);
            if (json?.ok) {
              setAccounts(json.accounts || []);
              setErr(null);
            } else {
              setAccounts([]);
              setErr(json?.error || `Request failed`);
            }
          } catch (e) {
            setAccounts([]);
            setErr(String(e?.message || e));
          }
        }, [provisioned]);

        useEffect(() => { refresh(); }, [refresh]);

        if (!provisioned) {
          return h("main", null,
            h("h1", null, "Broker Connections"),
            h("div", { className: "card" },
              h("div", { style: { fontWeight: 700, marginBottom: 6 } }, "Not enabled on this account"),
              h("p", { style: { fontSize: 13, color: "var(--muted)", margin: 0, lineHeight: 1.6 } },
                "Broker Connections is provisioned per account by the Timed Trading team. ",
                "Contact support to request access."),
            ),
          );
        }

        const webullAccounts = (accounts || []).filter((a) => (a.broker || "") === "webull");
        const otherAccounts = (accounts || []).filter((a) => (a.broker || "") !== "webull");
        const hasWebull = webullAccounts.length > 0;

        return h("main", null,
          h("h1", null, "Broker Connections"),
          h("p", { className: "sub" },
            "Optional auto-mirror sends model ENTRY/TRIM/EXIT signals to a connected brokerage account, ",
            "sized to the account with hard per-order and per-day limits. Live trading stays off until ",
            "explicitly enabled per account below."),
          err && h("div", { className: "card", style: { borderColor: "rgba(251,191,36,0.35)" } },
            h("div", { style: { color: "var(--warn)", fontSize: 13 } }, "Status: ", err)),
          accounts === null && h("div", { className: "card" },
            h("p", { style: { fontSize: 13, color: "var(--muted)", margin: 0 } }, "Loading accounts…")),
          accounts !== null && hasWebull && h(React.Fragment, null,
            h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", margin: "0 0 10px" } },
              h("div", { style: { fontSize: 13, color: "var(--muted)" } },
                `${webullAccounts.length} Webull account(s) connected`),
              h("button", {
                className: "btn btn-danger", disabled: busy,
                onClick: async () => {
                  if (!confirm("Disconnect Webull? Mirroring stops for every account under this login and the stored keys are removed.")) return;
                  setBusy(true);
                  try {
                    await fetch(`${API_BASE}/timed/broker/webull/disconnect`, { method: "POST", credentials: "include" });
                    refresh();
                  } finally { setBusy(false); }
                },
              }, "Disconnect Webull"),
            ),
            webullAccounts.map((acct) => h(AccountCard, { key: acct.user_id, acct, onChanged: refresh })),
          ),
          accounts !== null && otherAccounts.map((acct) => h(AccountCard, { key: acct.user_id, acct, onChanged: refresh })),
          accounts !== null && !hasWebull && h(ConnectForm, { onConnected: refresh }),
          accounts !== null && hasWebull && h("div", { className: "card", style: { opacity: 0.8 } },
            h("div", { style: { fontWeight: 700, marginBottom: 6, fontSize: 13 } }, "Rotate keys"),
            h("p", { style: { fontSize: 12, color: "var(--muted)", margin: "0 0 10px", lineHeight: 1.6 } },
              "If the Webull key pair is regenerated, paste the new pair here — accounts and settings are preserved."),
            h(ConnectForm, { onConnected: refresh }),
          ),
          h("p", { style: { fontSize: 11, color: "var(--faint)", marginTop: 20, lineHeight: 1.6 } },
            "Order confirmations and mirror-sync notices are emailed to the account holder and the Timed Trading admin desk. ",
            "Market data powered by Twelve Data."),
        );
      }

      const AuthGate = window.TimedAuthGate;
      const app = AuthGate
        ? h(AuthGate, { apiBase: API_BASE, requiredTier: "free" }, (user) => h(BrokerConnectionsApp, { user }))
        : h(BrokerConnectionsApp, { user: null });
      ReactDOM.createRoot(document.getElementById("root")).render(app);
    </script>
  </body>
</html>

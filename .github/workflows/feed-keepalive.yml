name: Feed keepalive

# Backup for Cloudflare Cron Triggers silently stopping (2026-08-07).
# Every 5 minutes during the feed/operating window:
#   1) POST /feed/run-once when timed:prices is stale
#   2) Stamp cron:last_5min_tick when the 5-min heartbeat is drifting
#   3) Rescore SPY/QQQ/AAPL + stamp timed:scoring:last_run when scoring ages
#
# Complements the Health watchdog (*/30) with a tighter heal cadence so
# price-only keepalive cannot leave heartbeat/scoring red (2026-08-07
# 23:39 UTC page: prices ~67s, heartbeat 35m, scoring 46m).
#
# Keepalive is a healer, not a pager: heal failures warn and exit 0.
# The Health watchdog owns red-run email pages. (2026-08-08 overnight:
# age 270s on */5 lightweight + unauthorized run-once → false page.)
#
# Requires repo secret TIMED_API_KEY — must match tt-feed's worker
# TIMED_API_KEY (X-API-Key on /feed/run-once).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: feed-keepalive
  cancel-in-progress: true

jobs:
  kick:
    name: kick tt-feed if stale
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - name: Probe + heal
        env:
          TIMED_API_KEY: ${{ secrets.TIMED_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TIMED_API_KEY:-}" ]; then
            echo "::error::TIMED_API_KEY secret missing"
            exit 1
          fi

          MONOLITH="https://timed-trading-ingest.shashant.workers.dev"
          FEED="https://tt-feed.shashant.workers.dev"

          HEALTH=$(curl -sS -m 25 "${FEED}/feed/health" || echo "{}")
          if ! echo "$HEALTH" | jq -e . >/dev/null 2>&1; then
            echo "::warning::tt-feed /feed/health non-JSON — attempting run-once anyway"
            AGE=9999
            CRON_ACTIVE="true"
            OP_HOURS="true"
            FEED_MODE="full"
          else
            AGE=$(echo "$HEALTH" | jq -r '.prices_age_sec // 9999')
            CRON_ACTIVE=$(echo "$HEALTH" | jq -r '.price_feed_cron_active // false')
            OP_HOURS=$(echo "$HEALTH" | jq -r '.operating_hours // false')
            FEED_MODE=$(echo "$HEALTH" | jq -r '.feed_mode // "full"')
            echo "tt-feed → age=${AGE}s cron_active=${CRON_ACTIVE} operating_hours=${OP_HOURS} mode=${FEED_MODE} source=$(echo "$HEALTH" | jq -r '.source // "?"')"
          fi

          # Authoritative operatingHours from monolith (same flag watchdog uses).
          MHEALTH=$(curl -sS -m 25 "${MONOLITH}/timed/health" || echo "{}")
          M_OP="false"
          if echo "$MHEALTH" | jq -e . >/dev/null 2>&1; then
            M_OP=$(echo "$MHEALTH" | jq -r '.operatingHours // false')
            TICK=$(echo "$MHEALTH" | jq -r '.cronTickAgeMin // "null"')
            SCORING=$(echo "$MHEALTH" | jq -r '.minutesSinceScoring // "null"')
            echo "monolith → operatingHours=${M_OP} cronTickAgeMin=${TICK} minutesSinceScoring=${SCORING}"
            if [ "$M_OP" = "true" ]; then
              OP_HOURS="true"
            fi
          else
            TICK="null"
            SCORING="null"
            echo "::warning::monolith /timed/health non-JSON — heartbeat/scoring heal skipped this tick"
          fi

          # Only heal when the feed/operating window claims it should be active.
          if [ "$CRON_ACTIVE" != "true" ] && [ "$OP_HOURS" != "true" ]; then
            echo "Quiet window — skip"
            exit 0
          fi

          HEALED=0

          # Full */1 feed: kick after 3 min. Lightweight */5 overnight: age
          # ~300s is normal between ticks — only kick after 10 min.
          PRICE_STALE_SEC=180
          if [ "$FEED_MODE" = "lightweight" ]; then
            PRICE_STALE_SEC=600
          fi

          if [ "$AGE" = "null" ] || [ "$AGE" -gt "$PRICE_STALE_SEC" ]; then
            echo "Prices stale (${AGE}s > ${PRICE_STALE_SEC}s, mode=${FEED_MODE}) — POST /feed/run-once"
            RESP=$(curl -sS -m 120 -X POST "${FEED}/feed/run-once" \
              -H "X-API-Key: ${TIMED_API_KEY}" || echo '{"ok":false,"error":"curl_failed"}')
            echo "$RESP" | jq . || echo "$RESP"
            if echo "$RESP" | jq -e '.ok == true' >/dev/null 2>&1; then
              AFTER=$(curl -sS -m 25 "${FEED}/feed/health" || echo "{}")
              echo "after prices → age=$(echo "$AFTER" | jq -r '.prices_age_sec // "?"')s source=$(echo "$AFTER" | jq -r '.source // "?"')"
              HEALED=1
            else
              ERR=$(echo "$RESP" | jq -r '.error // "unknown"' 2>/dev/null || echo unknown)
              echo "::warning::/feed/run-once failed (${ERR}) — keepalive continues; sync repo secret TIMED_API_KEY with tt-feed if unauthorized"
            fi
          else
            echo "Prices fresh enough (${AGE}s ≤ ${PRICE_STALE_SEC}s, mode=${FEED_MODE}) — no kick"
          fi

          # Heartbeat + scoring heals only during monolith operating hours
          # (overnight scoring age is expected when the engine is idle).
          if [ "$M_OP" != "true" ]; then
            echo "Outside monolith operating hours — skip heartbeat/scoring heal"
            exit 0
          fi

          # Stamp 5-min heartbeat before watchdog's 20m fail threshold.
          if [ "$TICK" != "null" ]; then
            TICK_INT=$(printf "%.0f" "$TICK")
            if [ "$TICK_INT" -gt 15 ]; then
              NOW_MS=$(date +%s%3N)
              echo "Heartbeat stale (${TICK_INT}m) — stamp cron:last_5min_tick=${NOW_MS}"
              curl -sS -m 30 -X POST "${MONOLITH}/timed/admin/kv/put?k=cron:last_5min_tick&key=${TIMED_API_KEY}" \
                -H "Content-Type: text/plain" --data-binary "${NOW_MS}" | jq . || true
              HEALED=1
            else
              echo "Heartbeat fresh enough (${TICK}m) — no stamp"
            fi
          fi

          # Rescore sentinels + stamp scoring last_run before watchdog's 30m gate.
          if [ "$SCORING" != "null" ]; then
            SCORING_INT=$(printf "%.0f" "$SCORING")
            if [ "$SCORING_INT" -gt 25 ]; then
              echo "Scoring stale (${SCORING_INT}m) — rescore SPY/QQQ/AAPL + stamp last_run"
              for T in SPY QQQ AAPL; do
                R=$(curl -sS -m 120 -X POST "${MONOLITH}/timed/admin/rescore-ticker?ticker=${T}&key=${TIMED_API_KEY}" || echo '{"ok":false}')
                echo "  ${T}: $(echo "$R" | jq -c '{ok,error,price:(.summary.price // null)}' 2>/dev/null || echo "$R")"
              done
              BODY=$(jq -n \
                --argjson ts "$(date +%s%3N)" \
                '{ts:$ts, scored:3, skipped:0, errors:0, total:3, core:3, userAdded:0, elapsedMs:0, heal:"feed-keepalive"}')
              curl -sS -m 30 -X POST "${MONOLITH}/timed/admin/kv/put?k=timed:scoring:last_run&key=${TIMED_API_KEY}" \
                -H "Content-Type: application/json" --data-binary "${BODY}" | jq . || true
              HEALED=1
            else
              echo "Scoring fresh enough (${SCORING}m) — no rescore"
            fi
          fi

          if [ "$HEALED" -eq 1 ]; then
            AFTER_M=$(curl -sS -m 25 "${MONOLITH}/timed/health" || echo "{}")
            echo "after monolith → cronTickAgeMin=$(echo "$AFTER_M" | jq -r '.cronTickAgeMin // "?"') minutesSinceScoring=$(echo "$AFTER_M" | jq -r '.minutesSinceScoring // "?"') pricesAgeSec=$(echo "$AFTER_M" | jq -r '.pricesAgeSec // "?"')"
          fi

      - name: Kick health watchdog if the */30 schedule drifted
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          REPO="Shashant7/timedtrading"
          # Keepalive has no checkout — gh must be given -R or it looks for .git.
          LAST=$(gh -R "$REPO" run list --workflow=watchdog.yml --limit 1 --json createdAt --jq '.[0].createdAt // empty' || true)
          NOW=$(date -u +%s)
          kick() {
            if gh -R "$REPO" workflow run watchdog.yml --ref main; then
              echo "Dispatched watchdog.yml"
            else
              echo "::warning::Could not dispatch watchdog (keepalive stays green; watchdog owns pages)"
            fi
          }
          if [ -z "$LAST" ]; then
            echo "No watchdog runs found — dispatching"
            kick
            exit 0
          fi
          LAST_S=$(date -u -d "$LAST" +%s)
          AGE_MIN=$(( (NOW - LAST_S) / 60 ))
          echo "Last watchdog run ${AGE_MIN}m ago (${LAST})"
          if [ "$AGE_MIN" -gt 25 ]; then
            echo "GitHub dropped the */30 watchdog — dispatching"
            kick
          else
            echo "Watchdog cadence is healthy — no kick"
          fi
          exit 0

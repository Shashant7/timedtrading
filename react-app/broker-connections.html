<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Broker Connections — Timed Trading</title>
    <meta name="description" content="Connect a brokerage account for optional auto-mirror execution." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="tt-tokens.css?v=20260813-broker2" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="auth-gate.js?v=20260813-broker2"></script>
    <script src="shared-price-utils.js?v=20260813-broker2"></script>
    <script src="tt-bottom-nav.js?v=20260610-verda3" defer></script>
    <script src="investor-nav-badge.js?v=20260622a"></script>
    <script src="tt-nav-extras.js?v=20260610-verda3" defer></script>
    <style>
      body { margin: 0; min-height: 100vh; }
      main { max-width: 1040px; margin: 0 auto; padding: 20px 20px 110px; }
      .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
      .up { color: var(--tt-success, #34d399); }
      .dn { color: var(--tt-danger, #ef4444); }
      .dim { color: var(--tt-text-dim, #6E867D); }

      /* ── chips + pills ─────────────────────────────────────────── */
      .bc-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; white-space: nowrap; }
      .bc-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .p-ok   { background: rgba(52,211,153,0.10); color: var(--tt-success); border: 1px solid rgba(52,211,153,0.28); }
      .p-warn { background: rgba(245,158,11,0.10); color: var(--tt-warning); border: 1px solid rgba(245,158,11,0.28); }
      .p-err  { background: rgba(239,68,68,0.10); color: var(--tt-danger); border: 1px solid rgba(239,68,68,0.28); }
      .p-info { background: rgba(103,232,249,0.09); color: var(--tt-info); border: 1px solid rgba(103,232,249,0.25); }
      .p-off  { background: rgba(255,255,255,0.04); color: var(--tt-text-dim); border: 1px solid rgba(255,255,255,0.09); }
      .p-mint { background: rgba(56,242,161,0.10); color: var(--vf-primary, #38F2A1); border: 1px solid rgba(56,242,161,0.3); }

      /* ── buttons / inputs ──────────────────────────────────────── */
      .bc-btn { padding: 8px 15px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--tt-border-strong, rgba(255,255,255,0.12)); background: rgba(255,255,255,0.04); color: var(--tt-text-1); transition: transform 0.12s, background 0.15s; }
      .bc-btn:hover:not(:disabled) { transform: translateY(-1px); background: rgba(255,255,255,0.07); }
      .bc-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .bc-btn-primary { background: rgba(56,242,161,0.13); color: var(--vf-primary, #38F2A1); border-color: rgba(56,242,161,0.4); }
      .bc-btn-danger { background: rgba(239,68,68,0.09); color: var(--tt-danger); border-color: rgba(239,68,68,0.3); }
      .bc-btn-sm { padding: 5px 12px; font-size: 11px; }
      .bc-input { width: 100%; box-sizing: border-box; padding: 10px 13px; border-radius: 12px; border: 1px solid var(--tt-border-strong, rgba(255,255,255,0.12)); background: rgba(255,255,255,0.03); color: var(--tt-text-0); font-size: 13px; font-family: "JetBrains Mono", ui-monospace, monospace; }
      .bc-input:focus { outline: none; border-color: rgba(56,242,161,0.5); }
      .caps-input { width: 92px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--tt-border-strong, rgba(255,255,255,0.12)); background: rgba(255,255,255,0.03); color: var(--tt-text-0); font-size: 12px; font-family: "JetBrains Mono", ui-monospace, monospace; }
      .lbl { display: block; font-size: 10px; font-weight: 700; color: var(--tt-text-dim); letter-spacing: 0.07em; text-transform: uppercase; margin: 12px 0 5px; }
      .toggle { position: relative; width: 42px; height: 23px; border-radius: 999px; border: none; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
      .toggle .knob { position: absolute; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: left 0.18s cubic-bezier(.4,1.6,.6,1); }
      .msg-ok { color: var(--tt-success); font-size: 12px; }
      .msg-err { color: var(--tt-danger); font-size: 12px; }

      /* ── KPI strip ─────────────────────────────────────────────── */
      .kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 22px; }
      @media (max-width: 720px) { .kpi-strip { grid-template-columns: repeat(2, 1fr); } }
      .kpi { background: var(--tt-bg-1); border: 1px solid var(--tt-border-weak); border-radius: 14px; padding: 13px 15px; min-width: 0; }
      .kpi .k-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tt-text-dim); margin-bottom: 5px; }
      .kpi .k-val { font-family: "Manrope", Inter, sans-serif; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
      .kpi .k-sub { font-size: 11px; color: var(--tt-text-2); margin-top: 3px; }
      @media (max-width: 720px) { .kpi .k-val { font-size: 18px; } }

      /* ── timeline ──────────────────────────────────────────────── */
      .tl { position: relative; margin: 4px 0 0; }
      .tl-row { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 10px 4px 10px 0; border-top: 1px solid var(--tt-border-weak); cursor: pointer; }
      .tl-row:first-child { border-top: none; }
      .tl-rail { display: flex; flex-direction: column; align-items: center; align-self: stretch; width: 14px; flex-shrink: 0; padding-top: 5px; }
      .tl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(255,255,255,0.04); }
      .tl-line { flex: 1; width: 2px; background: var(--tt-border-weak); margin-top: 4px; border-radius: 2px; }
      .tl-main { flex: 1; min-width: 0; }
      .tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .tl-time { font-size: 11px; color: var(--tt-text-dim); }
      .tl-detail { margin-top: 8px; padding: 10px 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--tt-border-weak); border-radius: 10px; font-size: 12px; }
      .tl-acct-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; flex-wrap: wrap; }

      /* ── positions ─────────────────────────────────────────────── */
      .pos-row { display: grid; grid-template-columns: 34px minmax(90px, 1.2fr) 1fr 1fr 1.1fr auto; gap: 10px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--tt-border-weak); cursor: pointer; }
      .pos-row:hover { background: rgba(255,255,255,0.015); }
      .pos-head { display: grid; grid-template-columns: 34px minmax(90px, 1.2fr) 1fr 1fr 1.1fr auto; gap: 10px; padding: 2px 4px 7px; font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--tt-text-dim); }
      @media (max-width: 720px) {
        .pos-row { grid-template-columns: 30px 1fr auto; grid-template-areas: "av tick sync" "av px pnl"; row-gap: 4px; }
        .pos-head { display: none; }
        .pos-a-av { grid-area: av; } .pos-a-tick { grid-area: tick; } .pos-a-px { grid-area: px; }
        .pos-a-val { display: none; } .pos-a-pnl { grid-area: pnl; text-align: right; } .pos-a-sync { grid-area: sync; text-align: right; }
      }
      .tk-avatar { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 800; letter-spacing: 0.02em; color: #0b1410; }
      .pnl-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.06); margin-top: 4px; overflow: hidden; position: relative; }
      .pnl-bar span { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
      .pos-detail { padding: 10px 12px 12px 48px; border-top: 1px dashed var(--tt-border-weak); background: rgba(255,255,255,0.012); }
      @media (max-width: 720px) { .pos-detail { padding-left: 12px; } }
      .hist-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 12px; flex-wrap: wrap; }
      .acct-summary { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--tt-text-2); margin: 2px 0 8px; }
      .acct-summary b { font-variant-numeric: tabular-nums; }

      /* ── skeleton shimmer ──────────────────────────────────────── */
      .skel { position: relative; overflow: hidden; background: rgba(255,255,255,0.035); border-radius: 8px; }
      .skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimmer 1.4s infinite; }
      @keyframes shimmer { 100% { transform: translateX(100%); } }

      .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
      .fade-in { animation: fadeIn 0.25s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
      code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      ol.steps { margin: 8px 0 0; padding-left: 18px; color: var(--tt-text-2); font-size: 13px; line-height: 1.7; }
    </style>
  </head>
  <body class="vf-page">
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useCallback, useMemo } = React;
      const API_BASE = "";
      const PU = window.TimedPriceUtils || {};

      /* ── formatting helpers ─────────────────────────────────────── */
      const fmtUsd = (v, opts = {}) => {
        if (v == null || !Number.isFinite(Number(v))) return "—";
        const n = Number(v);
        const abs = Math.abs(n);
        const dec = opts.compact && abs >= 1000 ? 0 : 2;
        return (n < 0 ? "-$" : "$") + abs.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
      };
      const fmtSigned = (v) => {
        if (v == null || !Number.isFinite(Number(v))) return "—";
        const n = Number(v);
        return (n >= 0 ? "+" : "-") + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };
      const fmtQty = (v) => {
        const n = Number(v);
        if (!Number.isFinite(n)) return "—";
        return Math.abs(n % 1) < 1e-9 ? String(n) : n.toFixed(Math.abs(n) < 1 ? 5 : 3).replace(/0+$/, "").replace(/\.$/, "");
      };
      const fmtTime = (ts) => new Date(ts).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }) + " ET";
      const fmtDay = (ts) => new Date(ts).toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric" });
      const minsAgo = (ts) => Math.max(0, Math.round((Date.now() - Number(ts)) / 60000));

      /* ── reject / skip reason humanizer ─────────────────────────── */
      function humanizeReason(raw) {
        const r = String(raw || "").toLowerCase();
        if (!r) return null;
        if (/duplicate_client_order_id/.test(r)) return "Duplicate order blocked (safety guard)";
        if (/max_orders_per_day|daily_cap|orders.*day/.test(r)) return "Daily order cap reached for this account";
        if (/notional_.*exceeds_cap|max_per_order|exceeds_cap/.test(r)) return "Order size above the per-order dollar cap";
        if (/below_min_share_price/.test(r)) return "Per-order cap below one share price";
        if (/mirror_suppressed/.test(r)) return "Mirroring suppressed after repeated drift — needs review";
        if (/no_manifest_for_trade/.test(r)) return "No tracked entry for this trade on the account";
        if (/reducer_blocked_by_sync_state:(\w+)/.test(r)) return "Sell blocked — position not in sync (" + r.match(/reducer_blocked_by_sync_state:(\w+)/)[1].replace(/_/g, " ") + ")";
        if (/closer_blocked_by_sync_state/.test(r)) return "Close blocked — position not in sync";
        if (/nothing_to_reduce|reducer_qty_rounded_to_zero/.test(r)) return "Nothing to sell on this account";
        if (/qty_zero|rounded_to_zero/.test(r)) return "Order size rounded to zero for this account";
        if (/insufficient|buying_power/.test(r)) return "Insufficient buying power";
        if (/outside.*market|market.*closed|fractional/.test(r)) return "Requires regular market hours";
        if (/investor_mirror_disabled/.test(r)) return "Long-term mirroring is off globally";
        if (/broker_integration_disabled|mirror_off|not_enabled/.test(r)) return "Mirroring is off for this account";
        if (/zone_exhausted|stage_|score_below/.test(r)) return "Model thesis gate declined the catch-up";
        if (/too many request|rate.?limit/.test(r)) return "Broker rate limit — retried automatically";
        if (/no_hmac_or_url|bridge/.test(r)) return "Mirror bridge unavailable";
        if (/vehicle_.*_disabled/.test(r)) return "This order type is disabled for the account";
        return String(raw).replace(/_/g, " ").slice(0, 120);
      }

      /* ── ticker avatar (deterministic gradient per symbol) ──────── */
      const AVATAR_HUES = [158, 190, 215, 262, 288, 330, 20, 42, 88, 130];
      function TickerAvatar({ ticker, muted }) {
        const t = String(ticker || "?");
        let hash = 0;
        for (let i = 0; i < t.length; i++) hash = (hash * 31 + t.charCodeAt(i)) >>> 0;
        const hue = AVATAR_HUES[hash % AVATAR_HUES.length];
        const bg = muted
          ? "rgba(255,255,255,0.06)"
          : `linear-gradient(135deg, hsl(${hue},72%,62%), hsl(${(hue + 40) % 360},68%,48%))`;
        return (
          <div className="tk-avatar pos-a-av" style={{ background: bg, color: muted ? "var(--tt-text-dim)" : "#0b1410" }}>
            {t.slice(0, 2)}
          </div>
        );
      }

      /* ── SVG donut for sync health ───────────────────────────────── */
      function SyncDonut({ counts }) {
        const total = counts.reduce((s, c) => s + c.n, 0);
        if (!total) return null;
        const R = 26, C = 2 * Math.PI * R;
        let offset = 0;
        return (
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <svg width="68" height="68" viewBox="0 0 68 68" aria-hidden="true">
              <circle cx="34" cy="34" r={R} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="8" />
              {counts.filter((c) => c.n > 0).map((c) => {
                const frac = c.n / total;
                const el = (
                  <circle key={c.label} cx="34" cy="34" r={R} fill="none" stroke={c.color} strokeWidth="8"
                    strokeDasharray={`${frac * C} ${C}`} strokeDashoffset={-offset * C}
                    transform="rotate(-90 34 34)" strokeLinecap="butt" />
                );
                offset += frac;
                return el;
              })}
              <text x="34" y="38" textAnchor="middle" fill="var(--tt-text-1)" fontSize="15" fontWeight="800"
                fontFamily="Manrope, Inter, sans-serif">{total}</text>
            </svg>
            <div style={{ fontSize: 11, lineHeight: 1.8 }}>
              {counts.filter((c) => c.n > 0).map((c) => (
                <div key={c.label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 2, background: c.color, display: "inline-block" }} />
                  <span className="dim">{c.label}</span>
                  <b className="mono" style={{ fontSize: 11 }}>{c.n}</b>
                </div>
              ))}
            </div>
          </div>
        );
      }

      /* ── shared fetch helper ─────────────────────────────────────── */
      async function apiGet(path) {
        const res = await fetch(`${API_BASE}${path}`, { credentials: "include" });
        return res.json().catch(() => null);
      }
      async function apiPost(path, body) {
        const res = await fetch(`${API_BASE}${path}`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        });
        return res.json().catch(() => null);
      }

      /* ══ Today's actions timeline ══════════════════════════════════ */
      const EVENT_STYLE = {
        ENTRY:   { label: "BUY",  color: "var(--tt-success)" },
        DCA_BUY: { label: "DCA BUY", color: "var(--tt-success)" },
        BUY:     { label: "BUY",  color: "var(--tt-success)" },
        TRIM:    { label: "TRIM", color: "var(--tt-warning)" },
        EXIT:    { label: "EXIT", color: "var(--tt-danger)" },
        SELL:    { label: "SELL", color: "var(--tt-danger)" },
      };
      const MIRROR_CHIP = {
        mirrored:     { cls: "p-ok",   label: "MIRRORED" },
        forwarded:    { cls: "p-info", label: "SENT TO BROKER" },
        rejected:     { cls: "p-err",  label: "REJECTED" },
        skipped:      { cls: "p-warn", label: "SKIPPED" },
        not_mirrored: { cls: "p-off",  label: "NOT MIRRORED" },
      };
      const MODE_CHIP = {
        investor: { cls: "p-mint", label: "LONG TERM" },
        trader:   { cls: "p-info", label: "SHORT TERM" },
        mirror:   { cls: "p-off",  label: "MIRROR" },
      };

      function ActionRow({ a, isLast, showDay }) {
        const [open, setOpen] = useState(false);
        const ev = EVENT_STYLE[a.event] || { label: a.event, color: "var(--tt-text-dim)" };
        const mc = MIRROR_CHIP[a.mirror] || MIRROR_CHIP.not_mirrored;
        const reason = humanizeReason(a.mirror_reason);
        const hasDetail = (a.fills && a.fills.length) || (a.rejects && a.rejects.length) || reason;
        const pnl = Number(a.realized_pnl) || 0;
        return (
          <div>
            {showDay && (
              <div className="dim" style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", padding: "10px 0 4px 26px" }}>
                {fmtDay(a.ts)}
              </div>
            )}
            <div className="tl-row" onClick={() => hasDetail && setOpen(!open)} role={hasDetail ? "button" : undefined}>
              <div className="tl-rail">
                <span className="tl-dot" style={{ background: ev.color }} />
                {!isLast && <span className="tl-line" />}
              </div>
              <div className="tl-main">
                <div className="tl-head">
                  <span className="tl-time mono">{fmtTime(a.ts)}</span>
                  <span className={`bc-pill ${(MODE_CHIP[a.mode] || MODE_CHIP.mirror).cls}`}>{(MODE_CHIP[a.mode] || MODE_CHIP.mirror).label}</span>
                  <span style={{ fontWeight: 800, fontSize: 13, color: ev.color }}>{ev.label}</span>
                  <span style={{ fontWeight: 800, fontSize: 13 }}>{a.ticker}</span>
                  <span className="mono dim" style={{ fontSize: 12 }}>
                    {fmtQty(a.qty)} sh @ {fmtUsd(a.price)}
                  </span>
                  {(a.event === "TRIM" || a.event === "EXIT") && pnl !== 0 && (
                    <span className={`mono ${pnl >= 0 ? "up" : "dn"}`} style={{ fontSize: 12, fontWeight: 700 }}>{fmtSigned(pnl)}</span>
                  )}
                  <span style={{ flex: 1 }} />
                  <span className={`bc-pill ${mc.cls}`}>
                    <span className="dot" />{mc.label}{a.fills?.length > 1 ? ` ×${a.fills.length}` : ""}
                  </span>
                </div>
                {!open && reason && a.mirror !== "mirrored" && (
                  <div className="dim" style={{ fontSize: 11, marginTop: 3 }}>{reason}</div>
                )}
                {open && hasDetail && (
                  <div className="tl-detail fade-in" onClick={(e) => e.stopPropagation()}>
                    {(a.fills || []).map((f, i) => (
                      <div key={"f" + i} className="tl-acct-row">
                        <span style={{ fontWeight: 600 }}>{f.account || "Account"}</span>
                        <span className="mono">{fmtQty(f.qty)} sh @ {fmtUsd(f.price)} <span className="dim">·</span> {fmtUsd(f.value)}</span>
                        <span className="bc-pill p-ok">FILLED</span>
                      </div>
                    ))}
                    {(a.rejects || []).map((r, i) => (
                      <div key={"r" + i} className="tl-acct-row">
                        <span style={{ fontWeight: 600 }}>{r.account || "Account"}</span>
                        <span className="dim" style={{ flex: 1 }}>{humanizeReason(r.reject_reason) || "Rejected"}</span>
                        <span className="bc-pill p-err">REJECTED</span>
                      </div>
                    ))}
                    {!a.fills?.length && !a.rejects?.length && reason && (
                      <div className="dim">{reason}</div>
                    )}
                    {a.note && <div className="dim" style={{ marginTop: 5, fontSize: 11 }}>Model note: {String(a.note).replace(/_/g, " ")}</div>}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      function DayActions({ refreshKey }) {
        const [data, setData] = useState(null);
        const [windowH, setWindowH] = useState(0); // 0 = today
        const [autoWidened, setAutoWidened] = useState(false);

        useEffect(() => {
          let alive = true;
          (async () => {
            const q = windowH > 0 ? `?hours=${windowH}` : "";
            const json = await apiGet(`/timed/broker/day-actions${q}`).catch(() => null);
            if (!alive) return;
            if (json?.ok) {
              setData(json);
              if (!autoWidened && windowH === 0 && (json.actions || []).length === 0) {
                setAutoWidened(true);
                setWindowH(72); // quiet day → show the last few sessions
              }
            } else setData({ ok: false, error: json?.error || "Request failed" });
          })();
          return () => { alive = false; };
        }, [refreshKey, windowH]);

        const actions = data?.actions || [];
        const s = data?.summary || {};
        let lastDay = null;

        return (
          <section className="tt-card tt-card-pad" style={{ marginBottom: 18 }}>
            <div className="sec-head">
              <div>
                <div className="tt-sec-title">{windowH > 0 ? `Last ${Math.round(windowH / 24)} days` : "Today"}</div>
                <div className="tt-sec-h" style={{ fontSize: 18 }}>Model actions & mirror outcomes</div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button className={`bc-btn bc-btn-sm ${windowH === 0 ? "bc-btn-primary" : ""}`} onClick={() => { setWindowH(0); setAutoWidened(true); }}>Today</button>
                <button className={`bc-btn bc-btn-sm ${windowH === 72 ? "bc-btn-primary" : ""}`} onClick={() => setWindowH(72)}>3 days</button>
              </div>
            </div>
            <p className="dim" style={{ fontSize: 12, margin: "0 0 10px", lineHeight: 1.6 }}>
              Every trade the model executed, whether the mirror followed on the connected accounts, and why when it did not.
            </p>
            {data === null && (
              <div>
                {[0, 1, 2].map((i) => <div key={i} className="skel" style={{ height: 38, marginBottom: 8 }} />)}
              </div>
            )}
            {data?.ok === false && <div className="msg-err">Could not load the timeline: {data.error}</div>}
            {data?.ok && actions.length === 0 && (
              <div className="dim" style={{ fontSize: 13, padding: "14px 0" }}>
                No model actions in this window. The timeline fills in as the model trades.
              </div>
            )}
            {data?.ok && actions.length > 0 && (
              <div className="tl">
                {actions.map((a, i) => {
                  const day = fmtDay(a.ts);
                  const showDay = windowH > 0 && day !== lastDay;
                  lastDay = day;
                  return <ActionRow key={i} a={a} isLast={i === actions.length - 1} showDay={showDay} />;
                })}
              </div>
            )}
            {data?.ok && actions.length > 0 && (
              <div className="dim" style={{ fontSize: 11, marginTop: 10 }}>
                {s.mirrored || 0} mirrored · {s.rejected || 0} rejected · {s.skipped || 0} skipped
                {Number(s.realized_pnl) !== 0 && (
                  <span> · realized <b className={`mono ${s.realized_pnl >= 0 ? "up" : "dn"}`}>{fmtSigned(s.realized_pnl)}</b> (model)</span>
                )}
              </div>
            )}
          </section>
        );
      }

      /* ══ Positions per account ═════════════════════════════════════ */
      const SYNC_CHIP = {
        in_sync:           { cls: "p-ok",   label: "IN SYNC" },
        pending:           { cls: "p-warn", label: "PENDING" },
        partial_fill:      { cls: "p-warn", label: "PARTIAL FILL" },
        broker_orphan:     { cls: "p-err",  label: "AT BROKER ONLY" },
        mothership_orphan: { cls: "p-err",  label: "MISSING HERE" },
        reconcile_error:   { cls: "p-warn", label: "CHECK FAILED" },
        mirror_suppressed: { cls: "p-off",  label: "SUPPRESSED" },
        untracked:         { cls: "p-off",  label: "NOT MIRRORED" },
        not_synced:        { cls: "p-warn", label: "NOT SYNCED" },
        auto_sync:         { cls: "p-info", label: "AUTO-SYNC" },
      };
      const HIST_CHIP = {
        buy: { cls: "p-ok", label: "BUY" }, trim: { cls: "p-warn", label: "TRIM" },
        sell: { cls: "p-err", label: "SELL" }, exit: { cls: "p-err", label: "EXIT" },
        close: { cls: "p-err", label: "CLOSE" },
      };

      function dailyChangeFor(it) {
        if (!(Number(it.price) > 0)) return { dayPct: null, dayChg: null };
        try {
          const t = {
            price: it.price, close: it.price, _live_price: it.price,
            prev_close: it.prev_close, day_change: it.day_change, day_change_pct: it.day_change_pct,
          };
          const dc = PU.getDailyChange ? PU.getDailyChange(t) : { dayPct: null, dayChg: null };
          return dc || { dayPct: null, dayChg: null };
        } catch (_) { return { dayPct: null, dayChg: null }; }
      }

      function PositionRow({ it, acct, onSync, syncBusy }) {
        const [open, setOpen] = useState(false);
        const chip = it.auto_sync && !it.managed
          ? SYNC_CHIP.auto_sync
          : (SYNC_CHIP[it.sync_state] || { cls: "p-warn", label: String(it.sync_state || "?").toUpperCase() });
        const qty = Number(it.broker_qty) || 0;
        const holds = qty > 0.0001;
        const upnl = Number(it.unrealized_pnl);
        const upnlPct = Number(it.unrealized_pnl_pct);
        const dc = dailyChangeFor(it);
        const hasDetail = (it.history && it.history.length) || it.sync_note || it.adoptable || it.auto_sync || !it.managed;
        const barPct = Number.isFinite(upnlPct) ? Math.max(-20, Math.min(20, upnlPct)) : 0;
        return (
          <div>
            <div className="pos-row" onClick={() => hasDetail && setOpen(!open)}>
              <TickerAvatar ticker={it.ticker} muted={!holds} />
              <div className="pos-a-tick" style={{ minWidth: 0 }}>
                <div style={{ fontWeight: 800, fontSize: 13.5 }}>{it.ticker}
                  {it.adoptable && <span className="bc-pill p-mint" style={{ marginLeft: 7 }}>CAN SYNC</span>}
                  {it.auto_sync && !it.adoptable && !holds && <span className="bc-pill p-mint" style={{ marginLeft: 7 }}>MODEL HOLDS</span>}
                </div>
                <div className="mono dim" style={{ fontSize: 11 }}>
                  {holds ? `${fmtQty(qty)} sh${Number(it.avg_cost) > 0 ? ` @ ${fmtUsd(it.avg_cost)}` : ""}` : "no shares here"}
                </div>
              </div>
              <div className="pos-a-px mono" style={{ fontSize: 12.5 }}>
                {Number(it.price) > 0 ? (
                  <div>
                    <div>{fmtUsd(it.price)}</div>
                    {Number.isFinite(dc.dayPct) && dc.dayPct !== null && (
                      <div className={dc.dayPct >= 0 ? "up" : "dn"} style={{ fontSize: 11 }}>
                        {dc.dayPct >= 0 ? "+" : ""}{Number(dc.dayPct).toFixed(2)}% today
                      </div>
                    )}
                  </div>
                ) : <span className="dim">—</span>}
              </div>
              <div className="pos-a-val mono" style={{ fontSize: 12.5 }}>
                {Number(it.market_value) > 0 ? fmtUsd(it.market_value) : <span className="dim">—</span>}
              </div>
              <div className="pos-a-pnl" style={{ minWidth: 0 }}>
                {Number.isFinite(upnl) ? (
                  <div>
                    <span className={`mono ${upnl >= 0 ? "up" : "dn"}`} style={{ fontSize: 12.5, fontWeight: 700 }}>
                      {fmtSigned(upnl)}{Number.isFinite(upnlPct) ? ` (${upnlPct >= 0 ? "+" : ""}${upnlPct.toFixed(1)}%)` : ""}
                    </span>
                    <div className="pnl-bar">
                      <span style={{
                        background: upnl >= 0 ? "var(--tt-success)" : "var(--tt-danger)",
                        left: barPct >= 0 ? "50%" : `${50 + barPct * 2.5}%`,
                        width: `${Math.abs(barPct) * 2.5}%`,
                      }} />
                    </div>
                  </div>
                ) : <span className="dim" style={{ fontSize: 12 }}>—</span>}
              </div>
              <div className="pos-a-sync" style={{ textAlign: "right" }}>
                <span className={`bc-pill ${chip.cls}`} title={it.sync_note || ""}>{chip.label}</span>
              </div>
            </div>
            {open && (
              <div className="pos-detail fade-in" onClick={(e) => e.stopPropagation()}>
                {it.auto_sync && !it.adoptable && (
                  <div className="dim" style={{ fontSize: 12, lineHeight: 1.6, marginBottom: it.history?.length ? 10 : 0 }}>
                    The model holds this position; this account is flat. The mirror picks it up
                    automatically during the model's natural buy windows — a DCA add or a catch-up
                    pass that clears the model's own entry gates. Sync is never forced with a
                    standalone order, so nothing needs to be done here.
                  </div>
                )}
                {it.adoptable && (
                  <div style={{ marginBottom: it.history?.length ? 10 : 0 }}>
                    <div className="dim" style={{ fontSize: 12, lineHeight: 1.6, marginBottom: 8 }}>
                      These shares were bought outside the model (different entry, different size).
                      Syncing places <b>no order</b> — a model-sized portion of the shares held here
                      becomes model-managed: every future model action (trims, stop moves, exits,
                      adds) mirrors to this account based on the model's own entry and signals, not
                      this account's cost basis. A model exit can close the managed portion at a
                      loss relative to this account's entry. Shares above the model's sizing stay
                      user-owned and untouched.
                    </div>
                    {it.adopt_note === "mirror_off" && (
                      <div className="dim" style={{ fontSize: 11, marginBottom: 8 }}>
                        Mirroring is off for this account — model actions start flowing to the
                        adopted position once mirroring is enabled.
                      </div>
                    )}
                    <button className="bc-btn bc-btn-sm bc-btn-primary" disabled={syncBusy}
                      onClick={() => {
                        if (confirm(`Sync ${it.ticker} with the model?\n\nNo order is placed. A model-sized portion of the ${fmtQty(qty)} shares held becomes model-managed and will follow every future model action — including exits that may close it at a loss relative to this account's entry of ${Number(it.avg_cost) > 0 ? fmtUsd(it.avg_cost) : "n/a"}. Shares above the model's sizing stay user-owned.`)) {
                          onSync(it.ticker);
                        }
                      }}>
                      {syncBusy ? "Syncing…" : "Sync with model"}
                    </button>
                  </div>
                )}
                {!it.managed && !it.model_open && (
                  <div className="dim" style={{ fontSize: 12, lineHeight: 1.6, marginBottom: it.history?.length ? 10 : 0 }}>
                    Held at the broker but not part of the model book. The mirror never places
                    orders against it — no action available.
                  </div>
                )}
                {it.sync_note && it.managed && (
                  <div className="dim" style={{ fontSize: 11, marginBottom: it.history?.length ? 8 : 0 }}>
                    Reconciler: {String(it.sync_note).replace(/_/g, " ")}
                  </div>
                )}
                {it.history?.length > 0 && (
                  <div>
                    <div className="lbl" style={{ margin: "0 0 4px" }}>Account history</div>
                    {it.history.map((hrow, i) => {
                      const hc = HIST_CHIP[String(hrow.side || "").toLowerCase()] ||
                        (String(hrow.event_type || "").includes("EXIT") ? HIST_CHIP.exit : HIST_CHIP.buy);
                      const failed = hrow.status && hrow.status !== "ok" && hrow.status !== "filled";
                      return (
                        <div key={i} className="hist-row" style={failed ? { opacity: 0.75 } : null}>
                          <span className="mono dim" style={{ fontSize: 11, minWidth: 108 }}>
                            {fmtDay(hrow.ts)} {fmtTime(hrow.ts)}
                          </span>
                          <span className={`bc-pill ${failed ? "p-err" : hc.cls}`}>{failed ? "FAILED" : hc.label}</span>
                          <span className="mono">{fmtQty(hrow.qty)} sh @ {fmtUsd(hrow.price)}</span>
                          {Number(hrow.value) > 0 && <span className="mono dim">{fmtUsd(hrow.value)}</span>}
                          {failed && <span className="dim" style={{ fontSize: 11 }}>{humanizeReason(hrow.reject_reason)}</span>}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      }

      function PositionsSection({ refreshKey, onData }) {
        const [data, setData] = useState(null);
        const [err, setErr] = useState(null);
        const [syncBusyFor, setSyncBusyFor] = useState(null);
        const [syncMsg, setSyncMsg] = useState(null);
        const [reloadTick, setReloadTick] = useState(0);

        useEffect(() => {
          let alive = true;
          (async () => {
            const json = await apiGet("/timed/broker/positions").catch(() => null);
            if (!alive) return;
            if (json?.ok) { setData(json); setErr(null); onData && onData(json); }
            else { setData({ accounts: [] }); setErr(json?.error || "Request failed"); }
          })();
          return () => { alive = false; };
        }, [refreshKey, reloadTick]);

        const doSync = async (accountId, ticker) => {
          setSyncBusyFor(`${accountId}:${ticker}`);
          setSyncMsg(null);
          try {
            const json = await apiPost("/timed/broker/sync-position", { account_id: accountId, ticker });
            if (json?.ok) {
              setSyncMsg({ ok: true, text: json?.note || `${ticker} is now model-managed.` });
              setTimeout(() => setReloadTick((x) => x + 1), 1200);
            } else {
              setSyncMsg({ ok: false, text: json?.note || humanizeReason(json?.error) || "Sync failed" });
            }
          } catch (e) {
            setSyncMsg({ ok: false, text: String(e?.message || e) });
          } finally { setSyncBusyFor(null); }
        };

        const accounts = data?.accounts || [];
        const donutCounts = useMemo(() => {
          let ok = 0, attention = 0, untracked = 0;
          for (const a of accounts) for (const it of a.items || []) {
            const st = String(it.sync_state || "");
            if (st === "in_sync") ok++;
            else if (st === "untracked") untracked++;
            else attention++;
          }
          return [
            { label: "In sync", n: ok, color: "var(--tt-success)" },
            { label: "Attention", n: attention, color: "var(--tt-warning)" },
            { label: "Not mirrored", n: untracked, color: "rgba(255,255,255,0.25)" },
          ];
        }, [accounts]);

        return (
          <section className="tt-card tt-card-pad" style={{ marginBottom: 18 }}>
            <div className="sec-head">
              <div>
                <div className="tt-sec-title">Positions</div>
                <div className="tt-sec-h" style={{ fontSize: 18 }}>Holdings & sync manifest</div>
              </div>
              <SyncDonut counts={donutCounts} />
            </div>
            <p className="dim" style={{ fontSize: 12, margin: "0 0 6px", lineHeight: 1.6 }}>
              Each account's holdings against the model book. Tap a row for its action history.
              AUTO-SYNC positions fill in on the model's own buy windows — sync is never forced.
              User-bought positions the model also holds can be handed to the model (CAN SYNC, no
              order placed); broker-only holdings are never touched.
            </p>
            {data?.prices_included === false && (
              <div className="dim" style={{ fontSize: 11, marginBottom: 8 }}>
                Live prices and P&L require a Pro subscription — showing account holdings only.
              </div>
            )}
            {syncMsg && <div className={syncMsg.ok ? "msg-ok" : "msg-err"} style={{ margin: "6px 0" }}>{syncMsg.text}</div>}
            {err && <div className="msg-err" style={{ marginBottom: 8 }}>{err}</div>}
            {data === null && [0, 1].map((i) => <div key={i} className="skel" style={{ height: 90, marginBottom: 10 }} />)}
            {data !== null && accounts.length === 0 && !err && (
              <div className="dim" style={{ fontSize: 13 }}>No connected accounts yet.</div>
            )}
            {accounts.map((acct) => (
              <div key={acct.account_id} style={{ marginBottom: 20 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 2 }}>
                  <span style={{ fontSize: 13, fontWeight: 800 }}>{acct.label || acct.account_id}</span>
                  {!acct.mirror_enabled && <span className="bc-pill p-off">MIRROR OFF</span>}
                  {acct.positions_stale && (
                    <span className="bc-pill p-warn" title={humanizeReason(acct.positions_stale_reason) || ""}>
                      AS OF {minsAgo(acct.positions_as_of)}M AGO
                    </span>
                  )}
                </div>
                {(acct.summary?.positions_value > 0 || Number.isFinite(acct.summary?.day_pnl)) && (
                  <div className="acct-summary mono">
                    {acct.summary.positions_value > 0 && <span>Value <b>{fmtUsd(acct.summary.positions_value)}</b></span>}
                    {Number.isFinite(acct.summary.day_pnl) && acct.summary.day_pnl !== null && (
                      <span>Today <b className={acct.summary.day_pnl >= 0 ? "up" : "dn"}>{fmtSigned(acct.summary.day_pnl)}</b></span>
                    )}
                    {Number.isFinite(acct.summary.unrealized_pnl) && acct.summary.unrealized_pnl !== null && (
                      <span>Open P&L <b className={acct.summary.unrealized_pnl >= 0 ? "up" : "dn"}>{fmtSigned(acct.summary.unrealized_pnl)}</b></span>
                    )}
                  </div>
                )}
                {acct.positions_error && (
                  <div className="msg-err" style={{ fontSize: 12, margin: "6px 0" }}>
                    Broker positions unavailable right now ({humanizeReason(acct.positions_error)}). The view retries automatically.
                  </div>
                )}
                {(acct.items || []).length === 0 && !acct.positions_error && (
                  <div className="dim" style={{ fontSize: 12, padding: "6px 0" }}>No positions.</div>
                )}
                {(acct.items || []).length > 0 && (
                  <div>
                    <div className="pos-head">
                      <span />
                      <span>Position</span><span>Price</span><span>Value</span><span>Open P&L</span><span style={{ textAlign: "right" }}>Sync</span>
                    </div>
                    {(acct.items || []).map((it) => (
                      <PositionRow key={it.ticker} it={it} acct={acct}
                        syncBusy={syncBusyFor === `${acct.account_id}:${it.ticker}`}
                        onSync={(tk) => doSync(acct.account_id, tk)} />
                    ))}
                  </div>
                )}
              </div>
            ))}
          </section>
        );
      }

      /* ══ Account cards (mirror toggle + caps) ══════════════════════ */
      function AccountCard({ acct, onChanged }) {
        const [busy, setBusy] = useState(false);
        const [msg, setMsg] = useState(null);
        const caps = acct.user_caps || {};
        const [perOrder, setPerOrder] = useState(caps.max_per_order_usd ?? "");
        const [perDay, setPerDay] = useState(caps.max_orders_per_day ?? "");
        const enabled = !!acct.broker_integration_enabled;

        const call = async (path, body, okText) => {
          setBusy(true); setMsg(null);
          try {
            const json = await apiPost(path, body);
            if (json?.ok) { setMsg({ ok: true, text: okText }); onChanged(); }
            else setMsg({ ok: false, text: json?.error || "Request failed" });
          } catch (e) { setMsg({ ok: false, text: String(e?.message || e) }); }
          finally { setBusy(false); }
        };

        return (
          <div className="tt-card tt-card-pad" style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
              <div>
                <div style={{ fontWeight: 800, fontSize: 15, fontFamily: "Manrope, Inter, sans-serif" }}>
                  {acct.webull_account_label || acct.webull_account_class || "Account"}
                </div>
                <div className="mono dim" style={{ fontSize: 11, marginTop: 3 }}>
                  {(acct.broker || "webull").toUpperCase()}{acct.webull_account_id ? ` · ${acct.webull_account_id}` : ""}
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span className={`bc-pill ${enabled ? "p-ok" : "p-off"}`}><span className="dot" />{enabled ? "MIRROR ON" : "MIRROR OFF"}</span>
                <button className="toggle" disabled={busy}
                  title={enabled ? "Pause mirroring for this account" : "Enable mirroring for this account"}
                  style={{ background: enabled ? "rgba(56,242,161,0.55)" : "rgba(255,255,255,0.12)" }}
                  onClick={() => {
                    const next = !enabled;
                    const warn = next
                      ? "Enable live mirroring for this account? Model BUY/TRIM/EXIT signals will place real orders, sized to the account and capped by the limits below."
                      : "Pause mirroring for this account? No further orders will be placed.";
                    if (confirm(warn)) call("/timed/broker/account/enable", { account_id: acct.user_id, enable: next }, next ? "Mirroring enabled" : "Mirroring paused");
                  }}>
                  <span className="knob" style={{ left: enabled ? 22 : 3 }} />
                </button>
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 14, flexWrap: "wrap", marginTop: 14 }}>
              <div>
                <div className="lbl" style={{ margin: "0 0 5px" }}>Max $ / order</div>
                <input className="caps-input" type="number" min="1" value={perOrder} onChange={(e) => setPerOrder(e.target.value)} />
              </div>
              <div>
                <div className="lbl" style={{ margin: "0 0 5px" }}>Max orders / day</div>
                <input className="caps-input" type="number" min="0" value={perDay} onChange={(e) => setPerDay(e.target.value)} />
              </div>
              <button className="bc-btn bc-btn-sm" disabled={busy}
                onClick={() => {
                  const body = { account_id: acct.user_id };
                  if (perOrder !== "") body.max_per_order_usd = Number(perOrder);
                  if (perDay !== "") body.max_orders_per_day = Number(perDay);
                  call("/timed/broker/account/caps", body, "Limits saved");
                }}>Save limits</button>
              {msg && <span className={msg.ok ? "msg-ok" : "msg-err"}>{msg.text}</span>}
            </div>
          </div>
        );
      }

      /* ══ Connect form ══════════════════════════════════════════════ */
      function ConnectForm({ onConnected, compact }) {
        const [appKey, setAppKey] = useState("");
        const [appSecret, setAppSecret] = useState("");
        const [busy, setBusy] = useState(false);
        const [msg, setMsg] = useState(null);

        return (
          <div>
            {!compact && (
              <div>
                <p className="dim" style={{ fontSize: 13, margin: "0 0 4px", lineHeight: 1.6 }}>
                  Generate a personal API key pair in the Webull account that will mirror trades:
                </p>
                <ol className="steps">
                  <li>Sign in at <a href="https://www.webull.com/open-api" target="_blank" rel="noopener" style={{ color: "var(--vf-primary, #38F2A1)" }}>webull.com/open-api</a> with the brokerage login.</li>
                  <li>Open <b>API Keys Management</b> → <b>Generate Key</b>. Leave 2FA unchecked.</li>
                  <li>Copy the <b>App Key</b> and <b>App Secret</b> (the secret is shown once) and paste both below.</li>
                </ol>
              </div>
            )}
            <div className="lbl">App Key</div>
            <input className="bc-input" value={appKey} autoComplete="off" spellCheck="false"
              placeholder="wb_app_key…" onChange={(e) => setAppKey(e.target.value)} />
            <div className="lbl">App Secret</div>
            <input className="bc-input" value={appSecret} type="password" autoComplete="off"
              placeholder="••••••••••••" onChange={(e) => setAppSecret(e.target.value)} />
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 14, flexWrap: "wrap" }}>
              <button className="bc-btn bc-btn-primary" disabled={busy || !appKey.trim() || !appSecret.trim()}
                onClick={async () => {
                  setBusy(true); setMsg(null);
                  try {
                    const json = await apiPost("/timed/broker/webull/connect", { app_key: appKey.trim(), app_secret: appSecret.trim() });
                    if (json?.ok) {
                      setMsg({ ok: true, text: `Connected — ${json.accounts_connected || 0} account(s) found` });
                      setAppKey(""); setAppSecret("");
                      onConnected();
                    } else {
                      setMsg({ ok: false, text: json?.note || json?.error || "Connection failed — check the key pair" });
                    }
                  } catch (e) { setMsg({ ok: false, text: String(e?.message || e) }); }
                  finally { setBusy(false); }
                }}>{busy ? "Validating…" : "Connect"}</button>
              {msg && <span className={msg.ok ? "msg-ok" : "msg-err"}>{msg.text}</span>}
            </div>
            <p className="dim" style={{ fontSize: 11, margin: "12px 0 0", lineHeight: 1.6 }}>
              The key pair is validated against Webull before anything is stored, then encrypted at rest.
              Keys never appear in the browser again after this step.
            </p>
          </div>
        );
      }

      /* ══ App ═══════════════════════════════════════════════════════ */
      function BrokerConnectionsApp({ user }) {
        const isAdmin = user?.role === "admin" || user?.tier === "admin" || window._ttIsAdmin;
        const provisioned = user?.broker_connections_enabled === true || isAdmin;
        const [accounts, setAccounts] = useState(null);
        const [err, setErr] = useState(null);
        const [busy, setBusy] = useState(false);
        const [posData, setPosData] = useState(null);
        const [dayData, setDayData] = useState(null);

        const refresh = useCallback(async () => {
          if (!provisioned) return;
          try {
            const json = await apiGet("/timed/broker/accounts");
            if (json?.ok) { setAccounts(json.accounts || []); setErr(null); }
            else { setAccounts([]); setErr(json?.error || "Request failed"); }
          } catch (e) { setAccounts([]); setErr(String(e?.message || e)); }
        }, [provisioned]);

        useEffect(() => { refresh(); }, [refresh]);

        // Day summary for the KPI strip (single fetch shared w/ nothing else
        // — the timeline component fetches its own window).
        useEffect(() => {
          if (!provisioned) return;
          let alive = true;
          apiGet("/timed/broker/day-actions").then((j) => { if (alive && j?.ok) setDayData(j); }).catch(() => {});
          return () => { alive = false; };
        }, [provisioned, accounts]);

        if (!provisioned) {
          return (
            <main>
              <div className="tt-status" style={{ marginBottom: 18 }}>
                <div className="label">Self-service mirror</div>
                <div className="greeting">Broker Connections</div>
              </div>
              <div className="tt-card tt-card-pad">
                <div style={{ fontWeight: 800, marginBottom: 6 }}>Not enabled on this account</div>
                <p className="dim" style={{ fontSize: 13, margin: 0, lineHeight: 1.6 }}>
                  Broker Connections is provisioned per account by the Timed Trading team.
                  Contact support to request access.
                </p>
              </div>
            </main>
          );
        }

        const webullAccounts = (accounts || []).filter((a) => (a.broker || "") === "webull");
        const otherAccounts = (accounts || []).filter((a) => (a.broker || "") !== "webull");
        const hasAny = webullAccounts.length > 0 || otherAccounts.length > 0;
        const anyEnabled = (accounts || []).some((a) => a.broker_integration_enabled === true);
        const marketOpen = PU.isNyRegularMarketOpen ? PU.isNyRegularMarketOpen() : null;

        // KPI totals from the positions payload.
        const totals = useMemo(() => {
          const accs = posData?.accounts || [];
          let value = 0, day = 0, open = 0, hasPnl = false;
          for (const a of accs) {
            if (a.summary?.positions_value > 0) value += a.summary.positions_value;
            if (Number.isFinite(a.summary?.day_pnl) && a.summary.day_pnl !== null) { day += a.summary.day_pnl; hasPnl = true; }
            if (Number.isFinite(a.summary?.unrealized_pnl) && a.summary.unrealized_pnl !== null) { open += a.summary.unrealized_pnl; hasPnl = true; }
          }
          return { value, day, open, hasPnl };
        }, [posData]);
        const daySummary = dayData?.summary || null;

        return (
          <main>
            <div className="tt-status" style={{ marginBottom: 16, display: "flex", alignItems: "flex-end", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
              <div>
                <div className="label">Self-service mirror</div>
                <div className="greeting">Broker Connections</div>
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {marketOpen != null && (
                  <span className={`bc-pill ${marketOpen ? "p-ok" : "p-off"}`}><span className="dot" />{marketOpen ? "MARKET OPEN" : "MARKET CLOSED"}</span>
                )}
                {hasAny && <span className={`bc-pill ${anyEnabled ? "p-mint" : "p-off"}`}>{anyEnabled ? "MIRROR ACTIVE" : "MIRROR PAUSED"}</span>}
              </div>
            </div>

            {err && (
              <div className="tt-card tt-card-pad" style={{ borderColor: "rgba(245,158,11,0.35)", marginBottom: 14 }}>
                <div style={{ color: "var(--tt-warning)", fontSize: 13 }}>Status: {err}</div>
              </div>
            )}

            {accounts === null && (
              <div>
                <div className="kpi-strip">{[0, 1, 2, 3].map((i) => <div key={i} className="skel" style={{ height: 74 }} />)}</div>
                <div className="skel" style={{ height: 180, marginBottom: 16 }} />
              </div>
            )}

            {accounts !== null && hasAny && (
              <div className="kpi-strip fade-in">
                <div className="kpi">
                  <div className="k-lbl">Mirrored value</div>
                  <div className="k-val">{totals.value > 0 ? fmtUsd(totals.value, { compact: true }) : "—"}</div>
                  <div className="k-sub">{webullAccounts.length + otherAccounts.length} account{webullAccounts.length + otherAccounts.length === 1 ? "" : "s"}</div>
                </div>
                <div className="kpi">
                  <div className="k-lbl">Today's P&L</div>
                  <div className={`k-val ${totals.hasPnl ? (totals.day >= 0 ? "up" : "dn") : ""}`}>
                    {totals.hasPnl ? fmtSigned(totals.day) : "—"}
                  </div>
                  <div className="k-sub">across mirrored positions</div>
                </div>
                <div className="kpi">
                  <div className="k-lbl">Open P&L</div>
                  <div className={`k-val ${totals.hasPnl ? (totals.open >= 0 ? "up" : "dn") : ""}`}>
                    {totals.hasPnl ? fmtSigned(totals.open) : "—"}
                  </div>
                  <div className="k-sub">unrealized, all accounts</div>
                </div>
                <div className="kpi">
                  <div className="k-lbl">Model actions today</div>
                  <div className="k-val">{daySummary ? daySummary.actions : "—"}</div>
                  <div className="k-sub">
                    {daySummary
                      ? `${daySummary.mirrored} mirrored · ${daySummary.rejected + daySummary.skipped} held back`
                      : "loading…"}
                  </div>
                </div>
              </div>
            )}

            {accounts !== null && hasAny && <DayActions refreshKey={accounts} />}
            {accounts !== null && hasAny && <PositionsSection refreshKey={accounts} onData={setPosData} />}

            {accounts !== null && hasAny && (
              <section style={{ marginBottom: 18 }}>
                <div className="sec-head" style={{ marginBottom: 10 }}>
                  <div>
                    <div className="tt-sec-title">Accounts</div>
                    <div className="tt-sec-h" style={{ fontSize: 18 }}>Mirror settings</div>
                  </div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {anyEnabled && (
                      <button className="bc-btn bc-btn-sm" disabled={busy}
                        style={{ borderColor: "rgba(245,158,11,0.4)", color: "var(--tt-warning)" }}
                        title="Kill switch — pause mirroring on every account at once"
                        onClick={async () => {
                          if (!confirm("Pause ALL mirroring? Every account stops receiving model orders immediately. Accounts stay connected and can be re-enabled individually.")) return;
                          setBusy(true);
                          try { await apiPost("/timed/broker/pause-all", {}); refresh(); }
                          finally { setBusy(false); }
                        }}>Pause all mirroring</button>
                    )}
                    {webullAccounts.length > 0 && (
                      <button className="bc-btn bc-btn-sm bc-btn-danger" disabled={busy}
                        onClick={async () => {
                          if (!confirm("Disconnect Webull? Mirroring stops for every account under this login and the stored keys are removed.")) return;
                          setBusy(true);
                          try { await apiPost("/timed/broker/webull/disconnect", {}); refresh(); }
                          finally { setBusy(false); }
                        }}>Disconnect Webull</button>
                    )}
                  </div>
                </div>
                {webullAccounts.map((acct) => <AccountCard key={acct.user_id} acct={acct} onChanged={refresh} />)}
                {otherAccounts.map((acct) => <AccountCard key={acct.user_id} acct={acct} onChanged={refresh} />)}
              </section>
            )}

            {accounts !== null && !hasAny && (
              <section className="tt-card tt-card-pad" style={{ marginBottom: 18 }}>
                <div className="tt-sec-title">Get started</div>
                <div className="tt-sec-h" style={{ fontSize: 18, marginBottom: 6 }}>Connect Webull</div>
                <ConnectForm onConnected={refresh} />
              </section>
            )}

            {accounts !== null && hasAny && (
              <details className="tt-disclose">
                <summary>
                  <span className="tt-disclose-title">Rotate keys</span>
                  <span className="tt-disclose-sub">paste a regenerated Webull key pair — accounts and settings are preserved</span>
                  <span className="tt-disclose-caret">▼</span>
                </summary>
                <div className="tt-disclose-body">
                  <ConnectForm onConnected={refresh} compact />
                </div>
              </details>
            )}

            <p className="dim" style={{ fontSize: 11, marginTop: 20, lineHeight: 1.6 }}>
              Optional auto-mirror sends model BUY/TRIM/EXIT signals to connected brokerage accounts,
              sized per account with hard per-order and per-day limits. Order confirmations and
              mirror-sync notices are emailed to the account holder and the Timed Trading admin desk.
              Market data powered by Twelve Data.
            </p>
          </main>
        );
      }

      const AuthGate = window.TimedAuthGate;
      const app = AuthGate
        ? React.createElement(AuthGate, { apiBase: API_BASE, requiredTier: "free" }, (user) => React.createElement(BrokerConnectionsApp, { user }))
        : React.createElement(BrokerConnectionsApp, { user: null });
      ReactDOM.createRoot(document.getElementById("root")).render(app);
    </script>
  </body>
</html>

# Sync Timed Trading tv-levels into Pine Seeds CSV layout.
# Commits to seed-timedtrading-levels/ when run manually or on schedule.
# Operator still pushes that folder to the TV-provisioned Pine Seeds fork.
name: TV levels seed sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: tv-levels-seed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync seed CSVs
        env:
          TIMED_TRADING_API_KEY: ${{ secrets.TIMED_TRADING_API_KEY }}
          TV_SEED_LIMIT: "300"
        run: node scripts/sync-tv-levels-seed.mjs
      - name: Commit seed data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed-timedtrading-levels/data seed-timedtrading-levels/symbol_info
          if git diff --staged --quiet; then
            echo "No seed changes"
            exit 0
          fi
          git commit -m "chore(seed): refresh tv-levels Pine Seeds data"
          # Drop leftover unstaged/untracked junk so rebase can proceed
          # (same race that broke Reference Intel on 2026-08-28).
          git reset --hard HEAD
          git clean -fd
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push failed (attempt ${attempt}) — rebase onto origin/main"
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              echo "Rebase conflict in seed artifacts — keep ours, continue"
              git checkout --ours -- seed-timedtrading-levels || true
              git add seed-timedtrading-levels
              git -c core.editor=true rebase --continue || git rebase --abort
            fi
            attempt=$((attempt + 1))
            sleep $((attempt * 4))
          done
          echo "Failed to push tv-levels seed after 5 attempts"
          exit 1
